<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ColorMind 配方帶回</title>
<style>
/*
  ColorMind 按「帶回配方」後回到這一頁（網址帶 code 與 req）。
  一載入就由 ERP 後端用 code 換配方，再把結果交給開啟預測的那個 ERP 分頁（BroadcastChannel，localStorage 為備援）。
  這一頁不載入任何外部資源，code 也立刻從網址列拿掉，不外流。
*/
:root{--bg:#faf9f5;--card:#fff;--ink:#1a1a1a;--muted:#6b7075;--line:#e3e5dc;--brand:#7dc067;--bad:#b55650}
@media (prefers-color-scheme:dark){:root{--bg:#121612;--card:#1b201b;--ink:#e8ebe6;--muted:#9aa19a;--line:#2c332c;--brand:#4a8a37;--bad:#e07a72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:560px;margin:12vh auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h1{font-size:18px;margin:0 0 8px}
p{margin:6px 0;color:var(--muted)}
.bad{color:var(--bad)}
.rows{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
button{margin-top:16px;font:inherit;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<main><div class="card">
  <h1 id="title">正在帶回 ColorMind 配方…</h1>
  <p id="msg">請稍候，不要關閉這個分頁。</p>
  <div class="rows" id="rows"></div>
  <button type="button" id="close" hidden>關閉此分頁</button>
</div></main>
<script>
(function () {
  var params = new URLSearchParams(location.search)
  var code = params.get('code')
  var req = params.get('req') || ''
  // 先把 code 從網址列與瀏覽紀錄拿掉
  history.replaceState(null, '', location.pathname)

  var $ = function (id) { return document.getElementById(id) }
  function deliver(payload) {
    var msg = Object.assign({ type: 'colormind-result', req: req, at: Date.now() }, payload)
    try { var ch = new BroadcastChannel('rorica-colormind'); ch.postMessage(msg); ch.close() } catch (e) {}
    try { localStorage.setItem('rorica-colormind-result', JSON.stringify(msg)) } catch (e) {}
  }
  function done(title, text, bad) {
    $('title').textContent = title
    $('msg').textContent = text
    if (bad) $('msg').className = 'bad'
    $('close').hidden = false
  }
  $('close').onclick = function () { window.close() }

  if (!code) {
    done('沒有可帶回的配方', '網址上沒有 ColorMind 的短碼，請回到 ERP 重新開啟預測。', true)
    return
  }
  fetch('/api/colormind/redeem', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  })
    .then(function (r) { return r.json().catch(function () { return {} }).then(function (b) { return { ok: r.ok, body: b } }) })
    .then(function (r) {
      if (!r.ok || !r.body || !Array.isArray(r.body.recipes)) {
        var err = (r.body && r.body.error) || '帶回失敗，請回到 ERP 重新開啟預測'
        deliver({ error: err })
        done('沒有帶回配方', err, true)
        return
      }
      deliver({ result: r.body })
      r.body.recipes.slice(0, 30).forEach(function (x) {
        var s = document.createElement('span')
        s.className = 'sw'
        s.style.background = 'rgb(' + x.R + ',' + x.G + ',' + x.B + ')'
        s.title = '#' + x['序號'] + '　C' + x.C + ' M' + x.M + ' Y' + x.Y + ' K' + x.K
        $('rows').appendChild(s)
      })
      done('已帶回 ' + r.body.recipes.length + ' 組配方', '「' + r.body['色樣名稱'] + '」的配方已送回 ERP。請回到 ERP 的分頁選擇要套用的一組，這個分頁可以關閉。')
    })
    .catch(function () {
      deliver({ error: '連不上 ERP，請回到 ERP 重新開啟預測' })
      done('沒有帶回配方', '連不上 ERP，請回到 ERP 重新開啟預測。', true)
    })
})()
</script>
</body>
</html>
