<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四模組協作中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operator console — top bar, agent board, swimlane strip, then conversation thread beside event detail; stacks to one column on phones */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --ink:#1B201E; --ink-2:#56605C; --line:#D7DCD6; --accent:#1E5E5B;
  --a-inq:#4B4FA8; --a-inv:#1F7A6E; --a-find:#8A4A86; --a-smp:#9C6216; --a-cat:#33648F; --a-human:#4F5552; --a-ext:#7A807D; --a-col:#A8456E;
  --m-plat:#8A4A86; --m-hub:#4F5552; --m-erp:#1F7A6E; --m-col:#A8456E;
  --st-sub:#7D8380; --st-work:#2C67C7; --st-wait:#B26F12; --st-ok:#2B7F50; --st-fail:#B83A2D;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191E1D; --surface-2:#222927; --ink:#E5EAE7; --ink-2:#9CA6A2; --line:#2E3633; --accent:#62B4AE;
  --a-inq:#9195E8; --a-inv:#4FC1B1; --a-find:#CC8EC7; --a-smp:#DCA352; --a-cat:#82B0DE; --a-human:#A9AFAC; --a-ext:#8E9491; --a-col:#E58BB0;
  --m-plat:#CC8EC7; --m-hub:#A9AFAC; --m-erp:#4FC1B1; --m-col:#E58BB0;
  --st-sub:#8E9491; --st-work:#71A4F2; --st-wait:#E5AB4C; --st-ok:#5EC28C; --st-fail:#EE6E60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191E1D; --surface-2:#222927; --ink:#E5EAE7; --ink-2:#9CA6A2; --line:#2E3633; --accent:#62B4AE;
  --a-inq:#9195E8; --a-inv:#4FC1B1; --a-find:#CC8EC7; --a-smp:#DCA352; --a-cat:#82B0DE; --a-human:#A9AFAC; --a-ext:#8E9491; --a-col:#E58BB0;
  --m-plat:#CC8EC7; --m-hub:#A9AFAC; --m-erp:#4FC1B1; --m-col:#E58BB0;
  --st-sub:#8E9491; --st-work:#71A4F2; --st-wait:#E5AB4C; --st-ok:#5EC28C; --st-fail:#EE6E60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:13px;font-weight:500;margin:0;color:var(--ink-2);letter-spacing:.08em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.topbar .left{display:grid;gap:2px}
.sub{color:var(--ink-2);font-size:12.5px}
.controls-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;color:var(--ink-2);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.params{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.params label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.scen-desc{color:var(--ink-2);font-size:13px;max-width:70ch}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:34px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.warn{color:var(--st-fail);border-color:color-mix(in srgb,var(--st-fail) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.row-hit:focus-visible,.msg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.agent{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--surface);position:relative}
.agent .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface);background:var(--c);flex:none}
.agent .role{font-size:12px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc);font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc)}
.pill.live::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.agent.dim{opacity:.55}
.lane-wrap{overflow-x:auto}
.lane-wrap svg{display:block}
.lane-wrap text{font-family:var(--font-ui)}
.row-hit{cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.thread{display:grid;gap:10px;max-height:620px;overflow-y:auto;padding-right:4px}
@media (max-width:860px){.thread{max-height:none}}
.handoff{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.handoff::before,.handoff::after{content:"";flex:1;border-top:1px dashed var(--line)}
.msg{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--surface);cursor:pointer;border-left:3px solid var(--c);border-top-left-radius:0;border-bottom-left-radius:0}
.msg.sel{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-left-color:var(--c)}
.msg-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.who .dot{width:20px;height:20px;font-size:10.5px}
.arrow{color:var(--ink-2)}
.meta{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:11.5px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.msg-body{font-size:14px;overflow-wrap:anywhere}
.approve{display:grid;gap:8px;margin-top:4px;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--st-wait) 10%,transparent);border:1px solid color-mix(in srgb,var(--st-wait) 40%,var(--line))}
.approve .acts{display:flex;flex-wrap:wrap;gap:8px}
.approve .rej{display:flex;flex-wrap:wrap;gap:8px}
.approve .rej input{flex:1;min-width:0}
.detail{position:sticky;top:12px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.payload{margin:0;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.empty{color:var(--ink-2);font-size:13px;padding:20px 4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--sc);display:inline-block}
.agent{transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease}
.agent.speaking{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent),0 6px 18px -8px color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-2px)}
.agent.receiving{border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 18%,transparent)}
.agent .act{font-size:12px;color:var(--c);min-height:1.3em;font-weight:500}
.agent.speaking .dot{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.12)}}
.msg.enter,.handoff.enter,.done-banner.enter{animation:slideIn .45s cubic-bezier(.2,.75,.25,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.enter-wait{animation:slideIn .45s cubic-bezier(.2,.75,.25,1),flash 1.4s ease-out .4s}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-wait) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.approve{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--st-wait) 22%,transparent)}}
.typing{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:6px 4px;animation:slideIn .3s ease-out}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots span{width:6px;height:6px;border-radius:50%;background:var(--c);animation:bounce 1s infinite}
.typing .dots span:nth-child(2){animation-delay:.15s}.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
.lane-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lane-fade{animation:fadeIn .3s .45s both}.lane-fade0{animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.flow{animation:march .6s linear infinite}@keyframes march{to{stroke-dashoffset:-14}}
.ping{animation:ping 1s ease-out infinite}@keyframes ping{50%{transform:scale(1.5);opacity:.5}}
.spin{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.done-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--st-ok) 45%,var(--line));background:color-mix(in srgb,var(--st-ok) 9%,var(--surface))}
.done-mark{width:26px;height:26px;border-radius:50%;background:var(--st-ok);position:relative;flex:none}
.done-mark::after{content:"";position:absolute;left:9px;top:5px;width:7px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#progress{transition:none}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;background:var(--surface);transition:box-shadow .3s ease,border-color .3s ease}
.mod:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mod .mh{display:flex;align-items:center;gap:8px;font-weight:500}
.mod .sq{width:12px;height:12px;border-radius:3px;background:var(--mc);flex:none}
.mod .cnt{margin-left:auto;font-size:12px;color:var(--ink-2)}
.mod .md{font-size:12px;color:var(--ink-2)}
.mod.on{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 30%,transparent)}
.mod.cur{background:color-mix(in srgb,var(--mc) 6%,var(--surface))}
.mtag{font-size:11px;padding:1px 7px;border-radius:999px;color:var(--mc);background:color-mix(in srgb,var(--mc) 13%,transparent);font-weight:500;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px;cursor:pointer;min-height:32px}
.tabs button[aria-selected="true"]{border-color:var(--mc);color:var(--ink);background:color-mix(in srgb,var(--mc) 12%,var(--surface))}
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.dt th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt tr.hl td{background:color-mix(in srgb,var(--st-wait) 14%,transparent)}
table.dt tr.new td{background:color-mix(in srgb,var(--st-ok) 14%,transparent)}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);vertical-align:middle}
.sw.big{width:60px;height:60px;border-radius:8px}
.lab-row{display:flex;gap:6px;align-items:end}
.lab-row input{width:76px}
.data-note{font-size:12px;color:var(--ink-2);margin-top:8px}
.subh{font-size:13px;font-weight:500;margin:14px 0 6px}
.subh:first-child{margin-top:0}
.target{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.lane-draw{stroke-dasharray:none;stroke-dashoffset:0}.agent.speaking{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="left">
      <h1>四模組協作中心</h1>
      <div class="sub">選布平台、代理人協作、ERP 串接與色彩資料庫在同一個畫面運作；對外送出前一律由業務確認。</div>
    </div>
    <div class="controls-top">
      <label class="sub" for="scenario">情境</label>
      <select id="scenario"></select>
      <div class="seg" role="group" aria-label="檢視角色">
        <button type="button" id="role-cust" aria-pressed="true">客戶視角</button>
        <button type="button" id="role-biz" aria-pressed="false">業務視角</button>
      </div>
      <span class="badge mono" id="asof"></span>
    </div>
  </header>

  <section class="panel" aria-labelledby="scen-title">
    <div class="panel-head">
      <div style="display:grid;gap:4px;min-width:0">
        <h2 id="scen-title">情境說明</h2>
        <div class="scen-desc" id="scen-desc"></div>
      </div>
      <div class="params" id="params"></div>
    </div>
  </section>

  <section aria-labelledby="mods-title" style="display:grid;gap:8px">
    <h2 id="mods-title">四個模組</h2>
    <div class="mods" id="mods"></div>
  </section>

  <section aria-labelledby="board-title" style="display:grid;gap:8px">
    <h2 id="board-title">代理人狀態</h2>
    <div class="board" id="board"></div>
  </section>

  <section class="panel" aria-labelledby="lane-title">
    <div class="panel-head">
      <h2 id="lane-title">協作時間軸</h2>
      <div class="legend">
        <span style="--sc:var(--st-work)"><i></i>請求</span>
        <span style="--sc:var(--st-ok)"><i></i>回覆</span>
        <span style="--sc:var(--st-wait)"><i></i>等待人工確認</span>
        <span>｜左側色條＝經過的模組</span>
      </div>
    </div>
    <div class="lane-wrap" id="lanes"></div>
  </section>

  <div class="main">
    <section class="panel" aria-labelledby="thread-title" style="display:grid;gap:10px">
      <div class="panel-head" style="margin:0">
        <h2 id="thread-title">對話交接</h2>
        <span class="sub" id="step-info"></span>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="player" aria-label="播放控制">
        <button class="btn primary" type="button" id="play">播放</button>
        <button class="btn" type="button" id="prev" aria-label="上一步">上一步</button>
        <button class="btn" type="button" id="next" aria-label="下一步">下一步</button>
        <button class="btn" type="button" id="replay">重播</button>
        <div class="seg" role="group" aria-label="播放速度">
          <button type="button" id="sp1" aria-pressed="true">1x</button>
          <button type="button" id="sp2" aria-pressed="false">2x</button>
        </div>
        <input type="range" id="progress" min="0" max="1" value="0" aria-label="播放進度">
      </div>
    </section>

    <aside class="panel detail" aria-labelledby="detail-title">
      <h2 id="detail-title">事件明細</h2>
      <div id="detail"></div>
    </aside>
  </div>

  <section class="panel" aria-labelledby="data-title">
    <div class="panel-head">
      <h2 id="data-title">模組資料</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>
    <div id="datapane"></div>
  </section>
</div>

<script>
const AG = {
  customer:{name:'客戶',sh:'客',c:'--a-ext',role:'海外客戶來信'},
  designer:{name:'設計師',sh:'設',c:'--a-ext',role:'選布平台使用者'},
  inquiry:{name:'詢價代理人',sh:'詢',c:'--a-inq',role:'讀信、統籌、擬回覆'},
  inventory:{name:'庫存代理人',sh:'庫',c:'--a-inv',role:'查庫存快照'},
  finder:{name:'選布代理人',sh:'選',c:'--a-find',role:'看圖找布、找替代'},
  sample:{name:'寄樣代理人',sh:'樣',c:'--a-smp',role:'審核申請、規劃樣布'},
  catalog:{name:'建檔代理人',sh:'檔',c:'--a-cat',role:'判讀屬性、對品號'},
  color:{name:'對色代理人',sh:'色',c:'--a-col',role:'查色彩資料庫、預測配方'},
  sales:{name:'業務',sh:'業',c:'--a-human',role:'確認、修改、退回'}
};
const BOARD = ['inquiry','inventory','finder','color','sample','catalog','sales'];
const STATUS = {
  SUBMITTED:{t:'已送出',c:'--st-sub'}, WORKING:{t:'處理中',c:'--st-work'},
  INPUT_REQUIRED:{t:'需要人確認',c:'--st-wait'}, COMPLETED:{t:'完成',c:'--st-ok'},
  FAILED:{t:'失敗',c:'--st-fail'}, CANCELED:{t:'已取消',c:'--st-sub'}
};

const SNAPSHOT = {
  asOf:'2026/11/16',
  items:{
    'S75':{name:'柔垂光澤緞'}, '3760':{name:'亮面鏡面緞'}, '630-1GU':{name:'霧面厚緞'},
    'KK98':{name:'硬挺厚緞'}, 'N120':{name:'網紗'}, '90125':{name:'90125'}, 'WT-7012':{name:'WT-7012'}
  },
  rolls:[
    ['S75','CHAMPAGNE','T7510301-01',45],['S75','CHAMPAGNE','T7510301-02',40],['S75','CHAMPAGNE','T7510301-03',35],['S75','CHAMPAGNE','T7510301-04',50,true],
    ['S75','IVORY','T7510288-01',55],['S75','IVORY','T7510288-02',55],['S75','IVORY','T7510288-03',54],['S75','IVORY','T7510288-04',56],['S75','IVORY','T7510288-05',55],['S75','IVORY','T7510288-06',52],
    ['3760','CHAMPAGNE','T3760114-01',55],['3760','CHAMPAGNE','T3760114-02',52],['3760','CHAMPAGNE','T3760114-03',50],['3760','CHAMPAGNE','T3760114-04',48],['3760','CHAMPAGNE','T3760114-05',60],
    ['3760','WHITE','T3760090-01',50],
    ['630-1GU','CHAMPAGNE','T6301207-01',50],['630-1GU','CHAMPAGNE','T6301207-02',55],
    ['KK98','WHITE','TKK98033-01',55],['KK98','WHITE','TKK98033-02',55],['KK98','WHITE','TKK98033-03',50],['KK98','WHITE','TKK98033-04',52],

function lab2rgb([L,a,b]){
  let y=(L+16)/116,x=a/500+y,z=y-b/200;
  const f=t=>t**3>0.008856?t**3:(t-16/116)/7.787;
  x=0.95047*f(x);y=1.0*f(y);z=1.08883*f(z);
  let r=x*3.2406+y*-1.5372+z*-0.4986,g=x*-0.9689+y*1.8758+z*0.0415,bl=x*0.0557+y*-0.2040+z*1.0570;
  const c=v=>{v=v>0.0031308?1.055*v**(1/2.4)-0.055:12.92*v;return Math.round(Math.max(0,Math.min(1,v))*255)};
  return `rgb(${c(r)},${c(g)},${c(bl)})`;
}
function dE00([L1,a1,b1],[L2,a2,b2]){
  const rad=Math.PI/180,C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2;
  const G=0.5*(1-Math.sqrt(Cb**7/(Cb**7+25**7)));
  const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const h=(b,ap)=>{if(b===0&&ap===0)return 0;let t=Math.atan2(b,ap)/rad;return t<0?t+360:t};
  const h1p=h(b1,a1p),h2p=h(b2,a2p);
  const dLp=L2-L1,dCp=C2p-C1p;let dhp=0;
  if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp/2*rad);
  const Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p;if(C1p*C2p!==0){if(Math.abs(h1p-h2p)>180)hbp+=hbp<360?360:-360;hbp/=2}
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.2*Math.cos((4*hbp-63)*rad);
  const dTh=30*Math.exp(-(((hbp-275)/25)**2)),RC=2*Math.sqrt(Cbp**7/(Cbp**7+25**7));
  const SL=1+0.015*(Lbp-50)**2/Math.sqrt(20+(Lbp-50)**2),SC=1+0.045*Cbp,SH=1+0.015*Cbp*T,RT=-Math.sin(2*dTh*rad)*RC;
  return Math.sqrt((dLp/SL)**2+(dCp/SC)**2+(dHp/SH)**2+RT*(dCp/SC)*(dHp/SH));
}

const S={scen:0,role:'cust',speed:1,events:[],shown:0,playing:false,timer:null,sel:null,plan:null,p:{sku:'S75',color:'CHAMPAGNE',qty:300},cp:{base:'S75',tkey:'nude',custom:[80,8,14],qty:300},rejecting:false,typing:null,fresh:null,tab:'col',hl:{}};
const $=id=>document.getElementById(id);
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function start(atRest){
  clearTimeout(S.timer);uid=0;
  const sc=SCENARIOS[S.scen];
  resetColorDB();S.hl={};
  S.plan=sc.build(sc.params==='color'?colorParams():S.p);
  S.events=S.plan.pre.slice();

}
function awaiting(){const e=S.events[S.shown-1];return !!e&&S.shown===S.events.length&&e.status==='INPUT_REQUIRED'&&!e.decided}
function isDone(){const hasHuman=S.events.some(e=>e.status==='INPUT_REQUIRED');return S.shown>0&&S.shown===S.events.length&&!awaiting()&&(!hasHuman||S.events.some(e=>e.decided))}
function schedule(ms){clearTimeout(S.timer);S.timer=setTimeout(()=>step(false),ms)}
function stopPlay(){S.playing=false;S.typing=null;clearTimeout(S.timer)}
function step(manual){
  if(awaiting()||S.shown>=S.events.length){S.playing=false;S.typing=null;render();return}
  const next=S.events[S.shown];
  if(!manual&&!REDUCE&&S.typing!==next){S.typing=next;render();schedule(Math.min(950,next.dt*0.65)/S.speed);return}
  S.typing=null;S.shown++;S.sel=next.id;S.fresh=next.id;if(next.onShow&&!next.applied){next.onShow();next.applied=true}if(next.hl){S.hl[next.hl.tab]=next.hl.key;S.tab=next.hl.tab}render();S.fresh=null;
  if(awaiting()){S.playing=false;renderControls();return}
  if(S.playing&&S.shown<S.events.length) schedule(Math.max(220,S.events[S.shown].dt*0.4)/S.speed);
  else {S.playing=false;renderControls();}
}
function decide(kind,reason){
  const e=S.events[S.shown-1];e.decided=kind;
  if(kind==='reject'){
    const owner=e.from;
    S.events.push(ev('sales',owner,'回覆','WORKING','退回：'+reason,{tag:'業務退回',src:'人工',dt:500,payload:{reason}}));
    S.events.push(ev(owner,'sales','等待人工','INPUT_REQUIRED',S.plan.revise,{tag:'修正待確認',payload:{revised:true}}));
  }else{
    S.events.push(...S.plan.post(kind));
  }
  S.rejecting=false;S.playing=true;S.typing=null;render();schedule(350/S.speed);
}

function boardState(){
  const st={};BOARD.forEach(a=>st[a]={s:'idle',t:'閒置'});
  const seen=new Set();
  S.events.slice(0,S.shown).forEach(e=>{
    seen.add(e.from);seen.add(e.to);
    if(e.status==='INPUT_REQUIRED'){if(st[e.to])st[e.to]={s:'INPUT_REQUIRED',t:'需要確認'};if(st[e.from])st[e.from]={s:'wait',t:'等待確認'};return}
    if(e.type==='請求'){if(st[e.to])st[e.to]={s:'WORKING',t:'處理中'};if(st[e.from]&&e.from!==e.to)st[e.from]={s:'wait',t:'等待回覆'};}
    else if(e.type==='呼叫工具'){if(st[e.from])st[e.from]={s:'WORKING',t:'處理中'};}
    else{if(st[e.from])st[e.from]={s:'COMPLETED',t:'完成'};if(st[e.to]&&e.status!=='WORKING')st[e.to]={s:'WORKING',t:'處理中'};if(st[e.to]&&e.status==='WORKING')st[e.to]={s:'WORKING',t:'修正中'};}
  });
  if(isDone()){BOARD.forEach(a=>{if(st[a].s!=='idle')st[a]={s:'COMPLETED',t:'完成'}});}
  return {st,seen};
}
const stc={idle:'--st-sub',wait:'--st-sub',WORKING:'--st-work',INPUT_REQUIRED:'--st-wait',COMPLETED:'--st-ok'};
function verb(e){return e.status==='INPUT_REQUIRED'?'送交確認':e.type==='請求'?'交辦':e.type==='呼叫工具'?'自行處理':'回覆'}

function renderBoard(){
  const {st}=boardState();const lanes=SCENARIOS[S.scen].lanes;
  const act={},cls={};
  if(S.typing){const t=S.typing;cls[t.from]='speaking';act[t.from]=t.from===t.to?'正在處理…':`正在${verb(t)}給 ${AG[t.to].name}…`;}
  else if(S.shown&&!isDone()){const e=S.events[S.shown-1];
    if(e.from!==e.to){cls[e.to]='receiving';act[e.to]=e.status==='INPUT_REQUIRED'?'等你確認':`收到 ${AG[e.from].name} 的${e.type==='請求'?'請求':'回覆'}`;}
    cls[e.from]=cls[e.from]||'speaking';act[e.from]=act[e.from]||(e.from===e.to?'處理中':`剛${verb(e)}給 ${AG[e.to].name}`);}
  $('board').innerHTML=BOARD.map(a=>{const g=AG[a],s=st[a];const live=s.s==='WORKING'||s.s==='INPUT_REQUIRED';const inL=lanes.includes(a);
    return `<div class="agent ${inL?'':'dim'} ${inL&&cls[a]?cls[a]:''}" style="--c:var(${g.c})"><div class="nm"><span class="dot" aria-hidden="true">${g.sh}</span>${g.name}</div><div class="role">${g.role}</div><span class="pill ${live?'live':''}" style="--sc:var(${stc[s.s]})">${inL?s.t:'本情境未參與'}</span><div class="act">${inL&&act[a]?act[a]:''}</div></div>`}).join('');
}
function evColor(e){return e.status==='INPUT_REQUIRED'?'--st-wait':(e.type==='請求'||e.type==='呼叫工具')?'--st-work':'--st-ok'}

    const fr=e.id===S.fresh&&!REDUCE,fade=fr?' class="lane-fade"':'';
    if(e.from===e.to){const x=cx(e.from);s+=`<path d="M${x} ${y-6} h22 v12 h-18" fill="none" stroke="${col}" stroke-width="1.6" ${fr?'class="lane-draw" style="--len:52"':''}/><path d="M${x+4} ${y+6} l6 -4 v8 z" fill="${col}"${fade}/><text x="${x+28}" y="${y+4}" font-size="11" fill="var(--ink-2)"${fade}>${e.tag}</text>`}
    else{const x1=cx(e.from),x2=cx(e.to),dir=x2>x1?1:-1,xe=x2-dir*5,len=Math.abs(xe-x1);

      if(fr)s+=`<circle cx="${x1}" cy="${y}" r="5" fill="${col}" opacity="0.9"><animate attributeName="cx" from="${x1}" to="${xe}" dur="0.55s" fill="freeze"/><animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.7;1" dur="0.8s" fill="freeze"/></circle>`;

    if(t.from===t.to){s+=`<circle cx="${x1+12}" cy="${y}" r="9" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="4 4" class="spin" style="transform-origin:${x1+12}px ${y}px"/>`}
    else{s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="1.2" stroke-dasharray="2 5" class="flow" opacity="0.7"/><circle cx="${x1}" cy="${y}" r="5" fill="${col}" class="ping" style="transform-origin:${x1}px ${y}px"/>`}

}
function clock(i){let t=0;for(let k=0;k<=i;k++)t+=Math.round(S.events[k].dt/300);const s=5+t;const m=2+Math.floor(s/60);return `14:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function who(a){const g=AG[a];return `<span class="who"><span class="dot" style="--c:var(${g.c})" aria-hidden="true">${g.sh}</span>${g.name}</span>`}

    owner=e.type==='回覆'?e.to:e.to;
    const st=STATUS[e.status];const pending=i===S.shown-1&&awaiting();
    html+=`<article class="msg ${e.id===S.sel?'sel':''} ${e.id===S.fresh&&!REDUCE?'enter':''} ${e.status==='INPUT_REQUIRED'&&e.id===S.fresh?'enter-wait':''}" data-id="${e.id}" tabindex="0" style="--c:var(${AG[e.from].c})"><div class="msg-head">${who(e.from)}<span class="arrow" aria-hidden="true">→</span>${who(e.to)}<span class="tag">${e.type}</span>${mtag(modOf(e))}${e.group?`<span class="tag">${e.group}</span>`:''}<span class="meta"><span class="pill" style="--sc:var(${st.c})">${st.t}</span><span class="mono">${clock(i)}</span></span></div><div class="msg-body">${T(e,S.role==='biz'?'biz':'cust')}</div><div class="sub">資料來源：${e.src}</div>${pending?approveBox():''}</article>`;
  });
  if(S.typing){const t=S.typing;
    if(t.type!=='回覆'&&t.from!==t.to&&t.to!==owner&&!['customer','designer'].includes(t.from))html+=`<div class="handoff enter">交接：${AG[t.from].name} → ${AG[t.to].name}</div>`;
    html+=`<div class="typing" style="--c:var(${AG[t.from].c})">${who(t.from)}<span>${t.from===t.to?'正在處理':`正在${verb(t)}給 ${AG[t.to].name}`}</span><span class="dots" aria-hidden="true"><span></span><span></span><span></span></span></div>`;}
  if(isDone()&&vis.length){
    const handoffs=vis.filter(e=>e.type==='請求'&&e.from!==e.to).length;
    const agents=new Set(vis.flatMap(e=>[e.from,e.to]).filter(a=>BOARD.includes(a)&&a!=='sales')).size;
    const human=vis.filter(e=>e.status==='INPUT_REQUIRED').length;
    html+=`<div class="done-banner ${S.fresh&&!REDUCE?'enter':''}"><span class="done-mark" aria-hidden="true"></span><div><strong>案件完成</strong><div class="sub">共 ${vis.length} 步・${handoffs} 次交辦・${agents} 個代理人參與・${human} 次人工確認</div></div></div>`;}
  if(!vis.length&&!S.typing)html=`<div class="empty">尚未開始。按「播放」看代理人如何一步步交接這件事。</div>`;
  const th=$('thread');th.innerHTML=html;th.scrollTop=th.scrollHeight;
  th.querySelectorAll('.msg').forEach(m=>{m.addEventListener('click',ev2=>{if(ev2.target.closest('.approve'))return;S.sel=m.dataset.id;render()});m.addEventListener('keydown',k=>{if(k.target!==m)return;if(k.key==='Enter'){S.sel=m.dataset.id;render()}})});
  const ap=th.querySelector('.approve');
  if(ap){
    ap.querySelector('#ap-ok').onclick=()=>decide('approve');
    ap.querySelector('#ap-mod').onclick=()=>decide('modify');
    ap.querySelector('#ap-rej').onclick=()=>{S.rejecting=true;render();const r=$('rej-reason');if(r)r.focus()};
    const go=ap.querySelector('#rej-go');
    if(go)go.onclick=()=>{const v=$('rej-reason').value.trim();const err=$('rej-err');if(!v){err.hidden=false;return}decide('reject',v)};
    const ri=$('rej-reason');if(ri)ri.addEventListener('input',()=>{$('rej-err').hidden=true});
  }
}
function approveBox(){
  return `<div class="approve"><strong style="font-size:13px">業務確認：這一步需要人工核准才會繼續</strong><div class="acts"><button class="btn primary" type="button" id="ap-ok">核准送出</button><button class="btn" type="button" id="ap-mod">修改後送出</button><button class="btn warn" type="button" id="ap-rej">退回</button></div>${S.rejecting?`<div class="rej"><input type="text" id="rej-reason" placeholder="退回原因，例如：請補上交期" aria-label="退回原因"><button class="btn warn" type="button" id="rej-go">確認退回</button></div><div class="sub" id="rej-err" hidden style="color:var(--st-fail)">請先填寫退回原因</div>`:''}</div>`;
}
function mask(payload,internal){
  if(S.role==='biz')return payload;
  const o=JSON.parse(JSON.stringify(payload));
  const hide=v=>typeof v==='number'?'（客戶視角隱藏）':v;
  internal.forEach(k=>{if(k in o){o[k]=typeof o[k]==='object'&&o[k]!==null?Object.fromEntries(Object.entries(o[k]).map(([a,b])=>[a,/available|rolls|reserved/i.test(a)?hide(b):b])):hide(o[k])}});
  return o;
}
function renderDetail(){
  const i=S.events.findIndex(e=>e.id===S.sel);const e=S.events[i];
  if(!e||i>=S.shown){$('detail').innerHTML=`<div class="empty">點選時間軸的箭頭或左側任一則對話，查看完整事件內容。</div>`;return}
  const st=STATUS[e.status];
  $('detail').innerHTML=`<dl class="kv"><dt>事件編號</dt><dd class="mono">${e.id}</dd><dt>案件</dt><dd class="mono">${SCENARIOS[S.scen].key.toUpperCase()}-128</dd><dt>發起者</dt><dd>${who(e.from)}</dd><dt>接收者</dt><dd>${who(e.to)}</dd><dt>類型</dt><dd>${e.type}</dd><dt>經過模組</dt><dd>${mtag(modOf(e))}</dd><dt>工具／標籤</dt><dd>${e.tag}</dd><dt>狀態</dt><dd><span class="pill" style="--sc:var(${st.c})">${st.t}</span> <span class="mono sub">${e.status}</span></dd><dt>時間</dt><dd class="mono">2026-11-16 ${clock(i)}</dd></dl>`;
}
function renderControls(){
  const n=S.events.length;
  $('play').textContent=S.playing?'暫停':'播放';
  $('play').disabled=awaiting()||(!S.playing&&S.shown>=n);
  $('prev').disabled=S.shown<=0;
  $('next').disabled=awaiting()||S.shown>=n;
  const pr=$('progress');pr.max=Math.max(n,1);pr.value=S.shown;
  const done=S.shown>=n&&!awaiting();
  $('step-info').textContent=awaiting()?`第 ${S.shown} 步・等待業務確認`:done?`共 ${S.shown} 步・已完成`:`第 ${S.shown}／${n} 步`;
  $('role-cust').setAttribute('aria-pressed',S.role==='cust');$('role-biz').setAttribute('aria-pressed',S.role==='biz');
  $('sp1').setAttribute('aria-pressed',S.speed===1);$('sp2').setAttribute('aria-pressed',S.speed===2);
}
function renderParams(){
  const sc=SCENARIOS[S.scen];$('scen-desc').textContent=sc.desc;
  if(sc.params==='color'){const c=S.cp;
    $('params').innerHTML=`<label for="c-base">布款<select id="c-base">${['S75','3760','630-1GU'].map(k=>`<option value="${k}" ${k===c.base?'selected':''}>${nm(k)}</option>`).join('')}</select></label><label for="c-t">指定顏色<select id="c-t">${Object.entries(TARGETS).map(([k,t])=>`<option value="${k}" ${k===c.tkey?'selected':''}>${t.name}</option>`).join('')}<option value="custom" ${c.tkey==='custom'?'selected':''}>自訂 Lab</option></select></label>${c.tkey==='custom'?`<div class="lab-row"><label for="c-L">L*<input type="number" id="c-L" step="0.1" min="0" max="100" value="${c.custom[0]}"></label><label for="c-a">a*<input type="number" id="c-a" step="0.1" min="-60" max="60" value="${c.custom[1]}"></label><label for="c-b">b*<input type="number" id="c-b" step="0.1" min="-60" max="60" value="${c.custom[2]}"></label></div>`:''}<span class="sw big" id="c-sw" style="width:34px;height:34px;background:${lab2rgb(c.tkey==='custom'?c.custom:TARGETS[c.tkey].lab)}" title="指定顏色預覽"></span><label for="c-q">需求碼數<input type="number" id="c-q" min="1" max="5000" step="10" value="${c.qty}" style="width:100px"></label><button class="btn primary" type="button" id="c-go">套用並重播</button><span class="sub" id="c-err" hidden style="color:var(--st-fail)">請輸入有效的數值</span>`;
    $('c-base').onchange=e=>{c.base=e.target.value};
    $('c-t').onchange=e=>{c.tkey=e.target.value;renderParams()};
    const upd=()=>{if(c.tkey!=='custom')return;const v=['c-L','c-a','c-b'].map(id=>parseFloat($(id).value));if(v.every(x=>!isNaN(x)))$('c-sw').style.background=lab2rgb(v)};
    ['c-L','c-a','c-b'].forEach(id=>{const el=$(id);if(el)el.oninput=()=>{$('c-err').hidden=true;upd()}});
    $('c-go').onclick=()=>{const q=parseInt($('c-q').value,10);let ok=q>0;let v=c.custom;if(c.tkey==='custom'){v=['c-L','c-a','c-b'].map(id=>parseFloat($(id).value));ok=ok&&v.every(x=>!isNaN(x))&&v[0]>=0&&v[0]<=100}if(!ok){$('c-err').hidden=false;return}c.qty=q;c.custom=v;start(false)};
    return}
  if(!sc.params){$('params').innerHTML=`<span class="sub">本情境的品項固定</span>`;return}
  const skus=Object.keys(SNAPSHOT.items).filter(s=>colorsOf(s).length);
  $('params').innerHTML=`<label for="p-sku">品項<select id="p-sku">${skus.map(s=>`<option value="${s}" ${s===S.p.sku?'selected':''}>${nm(s)}</option>`).join('')}</select></label><label for="p-color">顏色<select id="p-color">${colorsOf(S.p.sku).map(c=>`<option ${c===S.p.color?'selected':''}>${c}</option>`).join('')}</select></label><label for="p-qty">需求碼數<input type="number" id="p-qty" min="1" max="5000" step="10" value="${S.p.qty}" style="width:110px"></label><button class="btn primary" type="button" id="p-go">套用並重播</button>`;
  $('p-sku').onchange=e=>{S.p.sku=e.target.value;S.p.color=colorsOf(S.p.sku)[0];renderParams()};
  $('p-color').onchange=e=>{S.p.color=e.target.value};
  $('p-go').onclick=()=>{const q=parseInt($('p-qty').value,10);if(!(q>0)){$('p-qty').focus();return}S.p.qty=q;S.p.color=$('p-color').value;start(false)};
}

function colorParams(){const c=S.cp;const t=c.tkey==='custom'?{name:'自訂顏色',lab:c.custom.slice()}:TARGETS[c.tkey];return {target:t,base:c.base,qty:c.qty}}
function renderMods(){
  const vis=S.events.slice(0,S.shown);const cnt={plat:0,hub:0,erp:0,col:0};vis.forEach(e=>cnt[modOf(e)]++);
  const cur=S.typing?modOf(S.typing):(S.shown&&!isDone()?modOf(S.events[S.shown-1]):null);
  $('mods').innerHTML=Object.entries(MODS).map(([k,m])=>`<button type="button" class="mod ${cur===k?'on':''} ${S.tab===k?'cur':''}" data-k="${k}" style="--mc:var(${m.c})" aria-label="${m.name}，已呼叫 ${cnt[k]} 次，查看模組資料"><span class="mh"><span class="sq" aria-hidden="true"></span>${m.name}<span class="cnt mono">${cnt[k]} 次</span></span><span class="md">${m.d}</span></button>`).join('');
  $('mods').querySelectorAll('.mod').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;render();$('data-title').scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'start'})});
}
function renderData(){
  $('tabs').innerHTML=Object.entries(MODS).map(([k,m])=>`<button type="button" role="tab" aria-selected="${S.tab===k}" data-k="${k}" style="--mc:var(${m.c})">${m.name}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;render()});
  const biz=S.role==='biz';let h='';
  if(S.tab==='plat'){
    h=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>型錄貨號</th><th>名稱</th><th>ERP 產品編號</th><th>光澤</th><th>垂墜</th><th>手感</th><th>看圖相似度</th></tr></thead><tbody>${Object.keys(SNAPSHOT.items).map(k=>`<tr class="${S.hl.plat===k?'hl':''}"><td class="mono">${k}</td><td>${SNAPSHOT.items[k].name}</td><td class="mono">${ERPNO[k]}</td><td>${ATTR[k][0]}</td><td>${ATTR[k][1]}</td><td>${ATTR[k][2]}</td><td class="mono">${SCORE[k]?SCORE[k][0]+'%':'—'}</td></tr>`).join('')}</tbody></table></div><div class="data-note">選布平台以型錄貨號為主；ERP 產品編號由對照表轉換（示意對照）。</div>`;
  }else if(S.tab==='erp'){
    const groups={};SNAPSHOT.rolls.forEach(r=>{const k=r.sku+'|'+r.color;(groups[k]=groups[k]||{sku:r.sku,color:r.color,rs:[]}).rs.push(r)});
    h=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>產品編號</th><th>貨號</th><th>顏色</th>${biz?'<th>可用碼數</th><th>捲數</th><th>已預留</th>':'<th>現貨狀態</th>'}</tr></thead><tbody>${Object.entries(groups).map(([k,g])=>{const q=queryInventory(g.sku,g.color,1);return `<tr class="${S.hl.erp===k?'hl':''}"><td class="mono">${ERPNO[g.sku]}</td><td class="mono">${g.sku}</td><td>${g.color==='GREIGE'?'胚布（未染）':g.color}</td>${biz?`<td class="mono">${q.availableY}Y</td><td class="mono">${q.rolls}</td><td class="mono">${q.reservedY?q.reservedY+'Y':'—'}</td>`:`<td>${q.hasStock?'有現貨':'需訂製'}</td>`}</tr>`}).join('')}</tbody></table></div><div class="data-note">ERP 串接只讀不寫，每 15 分鐘同步；資料時間 ${SNAPSHOT.asOf} 14:00（示意資料）。${biz?'':'切換為業務視角才顯示數量。'}</div>`;
  }else if(S.tab==='col'){
    const rows=CDB.samples.map(x=>`<tr class="${CDB.newIds.has(x.id)?'new':S.hl.col===x.id?'hl':''}"><td><span class="sw" style="background:${lab2rgb(x.lab)}" aria-hidden="true"></span></td><td class="mono">${x.id}</td><td>${x.name}</td><td class="mono">${x.base}</td><td class="mono">${f1(x.lab[0])}</td><td class="mono">${f1(x.lab[1])}</td><td class="mono">${f1(x.lab[2])}</td><td>${x.src}</td></tr>`).join('');
    const sc=SCENARIOS[S.scen];let near='';
    if(sc.params==='color'&&S.plan&&S.plan.match){const M=S.plan.match,cp={target:M.target},n={x:M.near,d:M.d};
      near=`<div class="subh">本案對色結果</div><div class="target"><span class="sw big" style="background:${lab2rgb(cp.target.lab)}" title="指定顏色"></span><span class="sw big" style="background:${lab2rgb(n.x.lab)}" title="最接近色樣"></span><div><div>指定「${cp.target.name}」→ 最接近 <span class="mono">${n.x.id}</span>（${n.x.name}）</div><div class="sub">ΔE00 <span class="mono">${f2(n.d)}</span>・門檻 1.0・${n.d<=1?'可沿用既有色號':'需要新配方'}</div>${CDB.newIds.size?`<div class="sub">實測回填後已新增色樣 <span class="mono">${[...CDB.newIds][0]}</span>，下次相同顏色可直接沿用。</div>`:''}</div></div>`;
      if(!M.reuse){const rs=M.recs;near+=`<div class="subh">候選配方</div>${biz?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>配方</th><th>參考色樣</th><th>染料與濃度（% owf）</th><th>預估 ΔE00</th></tr></thead><tbody>${rs.map(r=>`<tr class="${S.hl.col==='recipes'?'hl':''}"><td class="mono">${r.no}</td><td class="mono">${r.from}</td><td>${r.dyes.map(d=>`${d.dye} ${d.c.toFixed(3)}`).join('、')}</td><td class="mono">${f2(r.pred)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="sub">已備妥 ${rs.length} 組候選配方；配方內容只對內部角色顯示。</div>`}`}}
    const ms=CDB.measurements.length?`<div class="subh">實測紀錄</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>配方</th><th>新增色樣</th><th>實測 L*</th><th>a*</th><th>b*</th><th>ΔE00</th><th>日期</th></tr></thead><tbody>${CDB.measurements.map(m=>`<tr class="new"><td class="mono">${m.recipe}</td><td class="mono">${m.sample}</td><td class="mono">${f1(m.lab[0])}</td><td class="mono">${f1(m.lab[1])}</td><td class="mono">${f1(m.lab[2])}</td><td class="mono">${f2(m.d)}</td><td class="mono">${m.date}</td></tr>`).join('')}</tbody></table></div>`:'';
    h=`${near}${ms}<div class="subh">色樣（${CDB.samples.length} 筆）</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>色塊</th><th>色樣編號</th><th>顏色</th><th>胚布</th><th>L*</th><th>a*</th><th>b*</th><th>來源</th></tr></thead><tbody>${rows}</tbody></table></div><div class="data-note">色差以 CIEDE2000 計算；色塊為螢幕示意，一律以實體色卡為準（示意資料）。</div>`;
  }else{
    const vis=S.events.slice(0,S.shown);
    h=vis.length?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>事件</th><th>發起者</th><th>接收者</th><th>模組</th><th>工具／標籤</th><th>狀態</th></tr></thead><tbody>${vis.map(e=>`<tr class="${e.id===S.sel?'hl':''}"><td class="mono">${e.id}</td><td>${AG[e.from].name}</td><td>${AG[e.to].name}</td><td>${mtag(modOf(e))}</td><td class="mono">${e.tag}</td><td>${STATUS[e.status].t} <span class="sub mono">${e.status}</span></td></tr>`).join('')}</tbody></table></div><div class="data-note">代理人協作模組的事件表，也是協作畫面的資料來源；任務狀態採 A2A v1.0 命名。</div>`:`<div class="empty">尚未有事件。按「播放」後，每一筆代理人之間的呼叫都會寫進這裡。</div>`;
  }
  $('datapane').innerHTML=h;
}
function render(){renderMods();renderBoard();renderLanes();renderThread();renderDetail();renderControls();renderData();}

$('scenario').innerHTML=SCENARIOS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
$('scenario').onchange=e=>{S.scen=+e.target.value;renderParams();start(false)};
$('asof').textContent=`ERP 快照 ${SNAPSHOT.asOf}・色彩資料庫 ${COLOR_SEED.length} 色・示意資料`;
$('role-cust').onclick=()=>{S.role='cust';render()};
$('role-biz').onclick=()=>{S.role='biz';render()};
$('sp1').onclick=()=>{S.speed=1;render()};
$('sp2').onclick=()=>{S.speed=2;render()};
$('play').onclick=()=>{if(S.playing){stopPlay()}else{S.playing=true;schedule(150)}render()};
$('next').onclick=()=>{stopPlay();step(true)};
$('prev').onclick=()=>{stopPlay();if(S.shown>0){S.shown--;S.sel=S.shown?S.events[S.shown-1].id:null}render()};
$('replay').onclick=()=>start(false);
$('progress').oninput=e=>{stopPlay();S.shown=+e.target.value;S.sel=S.shown?S.events[S.shown-1].id:null;render()};
renderParams();start(true);
</script>
</body>
</html>
