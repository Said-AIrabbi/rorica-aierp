<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents協作中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operator console — top bar, agent board, swimlane strip, then conversation thread beside event detail; stacks to one column on phones */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --ink:#1B201E; --ink-2:#56605C; --line:#D7DCD6; --accent:#1E5E5B;
  --a-inq:#4B4FA8; --a-inv:#1F7A6E; --a-find:#8A4A86; --a-smp:#9C6216; --a-cat:#33648F; --a-human:#4F5552; --a-ext:#7A807D; --a-col:#A8456E;
  --m-plat:#8A4A86; --m-hub:#4F5552; --m-erp:#1F7A6E; --m-col:#A8456E;
  --st-sub:#7D8380; --st-work:#2C67C7; --st-wait:#B26F12; --st-ok:#2B7F50; --st-fail:#B83A2D;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191E1D; --surface-2:#222927; --ink:#E5EAE7; --ink-2:#9CA6A2; --line:#2E3633; --accent:#62B4AE;
  --a-inq:#9195E8; --a-inv:#4FC1B1; --a-find:#CC8EC7; --a-smp:#DCA352; --a-cat:#82B0DE; --a-human:#A9AFAC; --a-ext:#8E9491; --a-col:#E58BB0;
  --m-plat:#CC8EC7; --m-hub:#A9AFAC; --m-erp:#4FC1B1; --m-col:#E58BB0;
  --st-sub:#8E9491; --st-work:#71A4F2; --st-wait:#E5AB4C; --st-ok:#5EC28C; --st-fail:#EE6E60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191E1D; --surface-2:#222927; --ink:#E5EAE7; --ink-2:#9CA6A2; --line:#2E3633; --accent:#62B4AE;
  --a-inq:#9195E8; --a-inv:#4FC1B1; --a-find:#CC8EC7; --a-smp:#DCA352; --a-cat:#82B0DE; --a-human:#A9AFAC; --a-ext:#8E9491; --a-col:#E58BB0;
  --m-plat:#CC8EC7; --m-hub:#A9AFAC; --m-erp:#4FC1B1; --m-col:#E58BB0;
  --st-sub:#8E9491; --st-work:#71A4F2; --st-wait:#E5AB4C; --st-ok:#5EC28C; --st-fail:#EE6E60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:13px;font-weight:500;margin:0;color:var(--ink-2);letter-spacing:.08em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.topbar .left{display:grid;gap:2px}
.sub{color:var(--ink-2);font-size:12.5px}
.controls-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;color:var(--ink-2);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent,var(--surface))}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.params{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.params label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.scen-desc{color:var(--ink-2);font-size:13px;max-width:70ch}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:34px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,var(--surface))}
.btn.warn{color:var(--st-fail);border-color:color-mix(in srgb,var(--st-fail) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.row-hit:focus-visible,.msg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.agent{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--surface);position:relative}
.agent .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface);background:var(--c);flex:none}
.agent .role{font-size:12px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc);font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc)}
.pill.live::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.agent.dim{opacity:.55}
.lane-wrap{overflow-x:auto}
.lane-wrap svg{display:block}
.lane-wrap text{font-family:var(--font-ui)}
.row-hit{cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.thread{display:grid;gap:10px;max-height:620px;overflow-y:auto;padding-right:4px}
@media (max-width:860px){.thread{max-height:none}}
.handoff{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.handoff::before,.handoff::after{content:"";flex:1;border-top:1px dashed var(--line)}
.msg{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--surface);cursor:pointer;border-left:3px solid var(--c);border-top-left-radius:0;border-bottom-left-radius:0}
.msg.sel{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-left-color:var(--c)}
.msg-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.who .dot{width:20px;height:20px;font-size:10.5px}
.arrow{color:var(--ink-2)}
.meta{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:11.5px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
/* 案件：每一步標示是選布平台真的發生過的事，還是代理人依開案資料產生的草稿 */
.rtag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid}
.rtag.real{color:var(--st-ok);border-color:var(--st-ok);font-weight:600}
.rtag.draft{color:var(--ink-2);border-color:var(--line);border-style:dashed}
.msg-body{font-size:14px;overflow-wrap:anywhere}
.approve{display:grid;gap:8px;margin-top:4px;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--st-wait) 10%,transparent);border:1px solid color-mix(in srgb,var(--st-wait) 40%,var(--line))}
.approve .acts{display:flex;flex-wrap:wrap;gap:8px}
.approve .rej{display:flex;flex-wrap:wrap;gap:8px}
.approve .rej input{flex:1;min-width:0}
.detail{position:sticky;top:12px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.payload{margin:0;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.empty{color:var(--ink-2);font-size:13px;padding:20px 4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--sc);display:inline-block}
.agent{transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease}
.agent.speaking{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent),0 6px 18px -8px color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-2px)}
.agent.receiving{border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 18%,transparent)}
.agent .act{font-size:12px;color:var(--c);min-height:1.3em;font-weight:500}
.agent.speaking .dot{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.12)}}
.msg.enter,.handoff.enter,.done-banner.enter{animation:slideIn .45s cubic-bezier(.2,.75,.25,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.enter-wait{animation:slideIn .45s cubic-bezier(.2,.75,.25,1),flash 1.4s ease-out .4s}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-wait) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.approve{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--st-wait) 22%,transparent)}}
.typing{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:6px 4px;animation:slideIn .3s ease-out}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots span{width:6px;height:6px;border-radius:50%;background:var(--c);animation:bounce 1s infinite}
.typing .dots span:nth-child(2){animation-delay:.15s}.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
.lane-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lane-fade{animation:fadeIn .3s .45s both}.lane-fade0{animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.flow{animation:march .6s linear infinite}@keyframes march{to{stroke-dashoffset:-14}}
.ping{animation:ping 1s ease-out infinite}@keyframes ping{50%{transform:scale(1.5);opacity:.5}}
.spin{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.done-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--st-ok) 45%,var(--line));background:color-mix(in srgb,var(--st-ok) 9%,var(--surface))}
.cm-order{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.cm-order.ok{border-color:color-mix(in srgb,var(--st-ok) 45%,var(--line))}
.cm-order.fail{border-color:color-mix(in srgb,var(--st-fail) 45%,var(--line))}
.cm-order .grow{flex:1;min-width:200px}
.done-mark{width:26px;height:26px;border-radius:50%;background:var(--st-ok);position:relative;flex:none}
.done-mark::after{content:"";position:absolute;left:9px;top:5px;width:7px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#progress{transition:none}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;background:var(--surface);transition:box-shadow .3s ease,border-color .3s ease}
.mod:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mod .mh{display:flex;align-items:center;gap:8px;font-weight:500}
.mod .sq{width:12px;height:12px;border-radius:3px;background:var(--mc);flex:none}
.mod .cnt{margin-left:auto;font-size:12px;color:var(--ink-2)}
.mod .md{font-size:12px;color:var(--ink-2)}
.mod.on{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 30%,transparent)}
.mod.cur{background:color-mix(in srgb,var(--mc) 6%,var(--surface))}
.mtag{font-size:11px;padding:1px 7px;border-radius:999px;color:var(--mc);background:color-mix(in srgb,var(--mc) 13%,transparent);font-weight:500;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px;cursor:pointer;min-height:32px}
.tabs button[aria-selected="true"]{border-color:var(--mc);color:var(--ink);background:color-mix(in srgb,var(--mc) 12%,var(--surface))}
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.dt th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt tr.hl td{background:color-mix(in srgb,var(--st-wait) 14%,transparent)}
table.dt tr.new td{background:color-mix(in srgb,var(--st-ok) 14%,transparent)}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);vertical-align:middle}
.sw.big{width:60px;height:60px;border-radius:8px}
.lab-row{display:flex;gap:6px;align-items:end}
.lab-row input{width:76px}
.data-note{font-size:12px;color:var(--ink-2);margin-top:8px}
.subh{font-size:13px;font-weight:500;margin:14px 0 6px}
.subh:first-child{margin-top:0}
.pp{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 4px}
.pp img{max-width:180px;max-height:180px;border:1px solid var(--line);border-radius:6px}
.pp .grow{flex:1;min-width:260px}
.pp-pick{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.target{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.lane-draw{stroke-dasharray:none;stroke-dashoffset:0}.agent.speaking{transform:none}}
/* 嵌在 ERP 頁面裡：標題由 ERP 頁首負責，這裡不重複；不留外框與內距，配色、字型跟著 ERP 主題 */
html.in-erp body{margin:0;background:transparent}
html.in-erp .wrap{max-width:none;padding:0;padding-bottom:2px}
html.in-erp .topbar .left{display:none}
html.in-erp .topbar{justify-content:flex-start}
html.in-erp .detail{position:static}
/* 整頁由 ERP 捲動：色彩資料庫等長表格改在自己的區塊內捲動，免得頁面拉得很長 */
html.in-erp .tbl-wrap{max-height:520px;overflow:auto}
html.in-erp table.dt thead th{position:sticky;top:0;background:var(--surface);z-index:1}
/* 待處理案件 */
.inbox{display:grid;gap:6px;margin-top:8px}
.inbox:empty{display:none}
.case{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.case:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.case[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.case .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.case{flex-wrap:wrap}.case .grow{flex-basis:100%;white-space:normal}}
</style>
<script src="colour-match.js"></script>
<script>
/*
  嵌在 ERP 裡時（同源，外層有 __FOUR_MODULE_BRIDGE__）：
  - 把 ERP 目前主題的顏色對應到本頁的色彩變數，ERP 換主題時跟著換；
  - 依內容高度撐開外層 iframe，讓整頁只有 ERP 一條捲軸，看起來就是 ERP 的一頁。
*/
(function(){
  let P=null;
  try{P=window.parent!==window&&window.parent.__FOUR_MODULE_BRIDGE__?window.parent.document:null}catch(e){P=null}
  if(!P)return;
  const root=document.documentElement;
  root.classList.add('in-erp');
  const MAP={'--bg':'--background','--surface':'--card','--surface-2':'--muted','--ink':'--foreground','--ink-2':'--muted-foreground','--line':'--border','--accent':'--primary','--on-accent':'--primary-foreground','--r':'--radius'};
  function syncTheme(){
    const cs=getComputedStyle(P.documentElement);
    const mode=P.documentElement.classList.contains('dark')?'dark':'light';
    root.dataset.theme=mode;root.style.colorScheme=mode; // 與外層一致，框架背景才會是透明的
    for(const k in MAP){const v=cs.getPropertyValue(MAP[k]).trim();if(v)root.style.setProperty(k,v);else root.style.removeProperty(k)}
    const font=getComputedStyle(P.body).fontFamily;if(font)root.style.setProperty('--font-ui',font);
  }
  syncTheme();
  new MutationObserver(syncTheme).observe(P.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']});
  function fit(){
    const fe=window.frameElement,w=document.querySelector('.wrap');
    if(fe&&w)fe.style.height=Math.ceil(w.getBoundingClientRect().height)+'px';
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const w=document.querySelector('.wrap');
    if(w&&'ResizeObserver' in window)new ResizeObserver(fit).observe(w);
    fit();
  });
})();
</script>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="left">
      <h1>Agents協作中心</h1>
      <div class="sub">選布平台、代理人協作、ERP 串接與色彩資料庫在同一個畫面運作；對外送出前一律由業務確認。</div>
    </div>
    <div class="controls-top">
      <label class="sub" for="scenario">示範情境</label>
      <select id="scenario"></select>
      <div class="seg" role="group" aria-label="檢視角色">
        <button type="button" id="role-cust" aria-pressed="true">客戶視角</button>
        <button type="button" id="role-biz" aria-pressed="false">業務視角</button>
      </div>
      <span class="badge mono" id="asof"></span>
      <span class="badge" id="sync" hidden></span>
    </div>
  </header>

  <section class="panel" aria-labelledby="inbox-title">
    <div class="panel-head">
      <div style="display:grid;gap:4px;min-width:0">
        <h2 id="inbox-title">待處理案件</h2>
        <div class="sub" id="inbox-note"></div>
      </div>
    </div>
    <div class="inbox" id="inbox"></div>
  </section>

  <section class="panel" aria-labelledby="scen-title">
    <div class="panel-head">
      <div style="display:grid;gap:4px;min-width:0">
        <h2 id="scen-title">情境說明</h2>
        <div class="scen-desc" id="scen-desc"></div>
      </div>
      <div class="params" id="params"></div>
    </div>
  </section>

  <section aria-labelledby="mods-title" style="display:grid;gap:8px">
    <h2 id="mods-title">四個模組</h2>
    <div class="mods" id="mods"></div>
  </section>

  <section aria-labelledby="board-title" style="display:grid;gap:8px">
    <h2 id="board-title">代理人狀態</h2>
    <div class="board" id="board"></div>
  </section>

  <section class="panel" aria-labelledby="lane-title">
    <div class="panel-head">

}
function dE00([L1,a1,b1],[L2,a2,b2]){
  const rad=Math.PI/180,C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2;
  const G=0.5*(1-Math.sqrt(Cb**7/(Cb**7+25**7)));
  const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const h=(b,ap)=>{if(b===0&&ap===0)return 0;let t=Math.atan2(b,ap)/rad;return t<0?t+360:t};
  const h1p=h(b1,a1p),h2p=h(b2,a2p);
  const dLp=L2-L1,dCp=C2p-C1p;let dhp=0;
  if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp/2*rad);
  const Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p;if(C1p*C2p!==0){if(Math.abs(h1p-h2p)>180)hbp+=hbp<360?360:-360;hbp/=2}
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.2*Math.cos((4*hbp-63)*rad);

      ev('finder','finder','呼叫工具','WORKING',`search_fabric：推薦 ${nm(base)}（${SCORE[base]?SCORE[base][0]:80}%，${SCORE[base]?SCORE[base][1]:'質感相近'}）`,{tag:'search_fabric',payload:{top:base,erp_no:ERPNO[base]},hl:{tab:'plat',key:base}}),
      ev('finder','color','請求','WORKING',`找 ${base} 胚布上最接近「${t.name}」的既有色樣`,{tag:'find_nearest_color',payload:{target_lab:t.lab,base}}),
      ev('color','finder','回覆','COMPLETED',reuse?`最接近 ${near.x.id}（${near.x.name}），ΔE00 ${f2(near.d)}，在 1.0 以內，可沿用既有${KIND}`:`最接近 ${near.x.id}（${near.x.name}），ΔE00 ${f2(near.d)}，超過 1.0，需要新配方`,{tag:'對色結果',payload:{nearest:near.x.id,lab:near.x.lab,dE00:+f2(near.d),reuse},src:'色彩資料庫計算',hl:{tab:'col',key:near.x.id}}),
      ev('finder','inquiry','請求','WORKING',`交辦詢價：${base}，${reuse?`${KIND} ${near.x.id}`:'需新配方'}，需求 ${qty}Y`,{tag:'交辦詢價',mod:'hub',payload:{base,color_ref:reuse?near.x.id:null,qty_y:qty}})
    ];
    let biz,cust,recs=null,cm=null,cmCut=-1;
    if(RECIPE_DB){
      /* 配方庫路線：夠近就沿用既有配方，否則請 ColorMind 以 Lab 預測（帶回 CMYK＋RGB）；兩者都要染色，查的是胚布 */
      if(reuse){
        pre.push(ev('inquiry','color','請求','WORKING',`取既有配方 ${near.x.id}`,{tag:'get_recipe',payload:{sample:near.x.id}}));
        pre.push(ev('color','inquiry','回覆','COMPLETED',r=>r==='biz'?`沿用既有配方 ${near.x.id}：${dyeTxt(near.x)}`:'沿用色彩資料庫的既有配方',{tag:'既有配方',payload:{sample:near.x.id,dyes:near.x.dyes},internal:['dyes'],src:'色彩資料庫',hl:{tab:'col',key:near.x.id}}));
      }else{
        cm=colormindPredict(t.name,t.lab);
        pre.push(ev('inquiry','color','請求','WORKING',`配方庫沒有 ΔE00 1.0 以內的配方，請 ColorMind 預測`,{tag:'predict_recipe',payload:{target_lab:t.lab}}));
        pre.push(ev('color','color','呼叫工具','WORKING',`ColorMind 預測：送出「${cm.色樣名稱}」L* ${cm.L}・a* ${cm.a}・b* ${cm.b}`,{tag:'colormind.predict',payload:{色樣名稱:cm.色樣名稱,L:cm.L,a:cm.a,b:cm.b},src:'ColorMind（模擬）',dt:1600}));
        /* 人員介入：ColorMind 的配方要有人在它的畫面上確認、按「帶回配方」才會回來；確認後才往下走（stage2） */
        pre.push(ev('color','sales','等待人工','INPUT_REQUIRED',`ColorMind 已產生預測配方。請到 ColorMind 確認「${cm.色樣名稱}」的配方，按「帶回配方」後繼續`,{tag:'ColorMind 待確認',stage:'colormind',payload:{色樣名稱:cm.色樣名稱,L:cm.L,a:cm.a,b:cm.b},
          revise:'ColorMind 已依退回意見重新預測。請再到 ColorMind 確認，按「帶回配方」後繼續'}));
        cmCut=pre.length;
        pre.push(ev('sales','color','回覆','COMPLETED','已在 ColorMind 確認配方，按下「帶回配方」',{tag:'帶回配方',src:'人工',dt:700,mod:'col'}));
        pre.push(ev('color','inquiry','回覆','COMPLETED',r=>r==='biz'?`ColorMind 帶回 ${cm.recipes.length} 組配方，第 1 組 ${cmykTxt(cm.recipes[0])}（RGB ${cm.recipes[0].R},${cm.recipes[0].G},${cm.recipes[0].B}）`:`已取得 ${cm.recipes.length} 組預測配方`,{tag:'ColorMind 配方',payload:{recipes:cm.recipes},internal:['recipes'],src:'ColorMind（模擬）',hl:{tab:'col',key:'recipes'}}));
      }
      const g=queryInventory(base,'GREIGE',qty);
      pre.push(ev('inquiry','inventory','請求','WORKING',`query_inventory：${ERPNO[base]}（${base}）胚布，需求 ${qty}Y`,{tag:'查胚布',payload:{erp_no:ERPNO[base],color:'GREIGE',qty_y:qty}}));
      pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${base} 胚布 ${stockText(g,r)}`,{tag:'胚布結果',payload:{...g},internal:['availableY','rolls','reservedY'],src:'ERP 快照計算',hl:{tab:'erp',key:base+'|GREIGE'}}));
      // ColorMind 的配方要等帶回才確定（可能換成真的回傳值），草稿在顯示時才組
      biz=reuse?`回覆草稿：${nm(base)} 以既有配方 ${near.x.id}（${near.x.name}，ΔE00 ${f2(near.d)}）染色；胚布${g.sufficient?'足夠':'不足'}，約 2 週交貨。`
        :()=>`回覆草稿：${nm(base)} 依 ColorMind 預測打色（第 1 組 ${cmykTxt(cm.recipes[0])}）；胚布${g.sufficient?'足夠':'不足'}，打色確認後約 3 週交貨。`;
      cust=reuse?`回覆草稿：${nm(base)} 有相近的既有配方，可直接染色，確認色卡後安排生產。`:`回覆草稿：${nm(base)} 可依指定顏色打色，確認色卡後安排生產。`;
    }else if(reuse){
      const res=queryInventory(base,near.x.name,qty);
      pre.push(ev('inquiry','inventory','請求','WORKING',`query_inventory：${ERPNO[base]}（${base}）${near.x.name}，需求 ${qty}Y`,{tag:'query_inventory',payload:{erp_no:ERPNO[base],color:near.x.name,qty_y:qty}}));
      pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${base}（${near.x.name}）${stockText(res,r)}；資料時間 ${SNAPSHOT.asOf} ${SNAPSHOT.time||'14:00'}`,{tag:'庫存結果',payload:{...res},internal:['availableY','rolls','reservedY'],src:'ERP 快照計算',hl:{tab:'erp',key:base+'|'+near.x.name}}));
      const short=Math.max(0,qty-res.availableY);
      biz=short?`回覆草稿：${nm(base)}，色號 ${near.x.id}（ΔE00 ${f2(near.d)}）。現貨 ${res.availableY}Y，其餘 ${short}Y 以同色號染整，交期另行確認。`:`回覆草稿：${nm(base)}，色號 ${near.x.id}（ΔE00 ${f2(near.d)}），現貨可供 ${qty}Y。`;
      cust=short?`回覆草稿：${nm(base)} 有相近色號，部分現貨，其餘依同色號染整。`:`回覆草稿：${nm(base)} 有相近色號，有現貨。`;
    }else{
      recs=predictRecipes(t.lab,base);
      const g=queryInventory(base,'GREIGE',qty);
      pre.push(ev('inquiry','color','請求','WORKING',`predict_recipe：${base} 胚布、目標 ${labTxt}`,{tag:'predict_recipe',payload:{target_lab:t.lab,base}}));
      pre.push(ev('color','inquiry','回覆','COMPLETED',r=>r==='biz'?`候選配方 ${recs.length} 組：${recs.map(x=>`${x.no} 預估 ΔE00 ${f2(x.pred)}`).join('、')}`:`已備妥 ${recs.length} 組候選配方`,{tag:'候選配方',payload:{recipes:recs.map(x=>({no:x.no,pred_dE00:+f2(x.pred),dyes:x.dyes.map(d=>`${d.dye} ${d.c.toFixed(3)}%`)}))},internal:['recipes'],src:'色彩資料庫計算',hl:{tab:'col',key:'recipes'}}));
      pre.push(ev('inquiry','inventory','請求','WORKING',`query_inventory：${ERPNO[base]}（${base}）胚布，需求 ${qty}Y`,{tag:'查胚布',payload:{erp_no:ERPNO[base],color:'GREIGE',qty_y:qty}}));
      pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${base} 胚布 ${stockText(g,r)}`,{tag:'胚布結果',payload:{...g},internal:['availableY','rolls','reservedY'],src:'ERP 快照計算',hl:{tab:'erp',key:base+'|GREIGE'}}));
      biz=`回覆草稿：${nm(base)} 需依新配方打色（${recs[0].no}，預估 ΔE00 ${f2(recs[0].pred)}）；胚布${g.sufficient?'足夠':'不足'}，打色確認後約 3 週交貨。`;
      cust=`回覆草稿：${nm(base)} 可依指定顏色打色，確認色卡後安排生產。`;
    }
    const bizNow=()=>typeof biz==='function'?biz():biz;
    pre.push(ev('inquiry','sales','等待人工','INPUT_REQUIRED',r=>r==='biz'?bizNow():cust,{tag:'草稿待確認',payload:{get draft(){return bizNow()}},internal:['draft']}));
    /* ColorMind 路線：「到 ColorMind 確認並帶回」之後的步驟（帶回配方、查胚布、回覆草稿）留到確認後才出現 */
    const stage2=cmCut>=0?pre.splice(cmCut):null;
    return {pre,post:(k,e)=>{
      if(stage2&&e&&e.stage==='colormind'){
        if(cm.live)stage2.forEach(x=>{if(x.src==='ColorMind（模擬）')x.src='ColorMind 測試站'});
        return stage2.splice(0);}
      const out=[ev('sales','inquiry','回覆','COMPLETED',k==='modify'?'修改一句後核准送出':'核准送出',{tag:'業務核准',src:'人工',dt:700}),
        ev('inquiry','designer','回覆','COMPLETED','回覆已送出，案件紀錄存入選布平台',{tag:'已送出',mod:'plat'})];
      if(recs||cm){const rno=cm?'ColorMind #1':recs[0].no;const meas=[t.lab[0]+0.4,t.lab[1]-0.3,t.lab[2]+0.5];const d=dE00(t.lab,meas);
        const newId=cm?'PET-N0001':`T${({'S75':'7510','3760':'3760','630-1GU':'6301'})[base]||'0000'}401-1A`;
        out.push(ev('color','color','狀態變更','COMPLETED',r=>r==='biz'?`record_measurement：染廠依 ${rno} 打色，實測 L* ${f1(meas[0])}・a* ${f1(meas[1])}・b* ${f1(meas[2])}，ΔE00 ${f2(d)}；新增色樣 ${newId} 並校正`:`染廠打色後的實測值已寫回色彩資料庫，新增色樣 ${newId}`,
          {tag:'實測回填',src:'實測值',dt:1400,payload:{recipe:rno,measured_lab:meas.map(v=>+f1(v)),dE00:+f2(d),new_sample:newId},hl:{tab:'col',key:newId},
           onShow(){if(CDB.samples.some(x=>x.id===newId))return;CDB.samples.unshift({id:newId,name:t.name.replace(/（.*）/,''),base:cm?'PET':base,lab:meas,src:'染廠打色',status:'已驗證',dyes:[]});CDB.measurements.unshift({recipe:rno,sample:newId,lab:meas,d,date:'2026-11-16'});CDB.newIds.add(newId)}}));}
      return out;},
      revise:'修正後的回覆草稿（已補上色差說明）',match:{target:t,near:near.x,d:near.d,reuse,recs,cm}};
  }},
 {key:'s1',name:'情境 1｜詢價缺貨找替代布',lanes:['customer','inquiry','inventory','finder','sample','sales'],
  desc:'海外客戶來信詢價。庫存代理人依庫存快照算出可用量，不足時詢價代理人才請選布代理人找替代布；換一個品項或碼數，路線就會不同。',
  params:true,
  build(p){
    const res=queryInventory(p.sku,p.color,p.qty);
    const pre=[ev('customer','inquiry','請求','SUBMITTED',`來信：${nm(p.sku)}（${p.color}）${p.qty}Y，希望 3 月交貨`,{tag:'客戶來信',payload:{item:p.sku,color:p.color,qty_y:p.qty,due:'2027-03'},src:'劇本',dt:600})];
    pre.push(ev('inquiry','inventory','請求','WORKING',`查 ${p.sku}（${p.color}）可用庫存，需求 ${p.qty}Y`,{tag:'查庫存',payload:{item:p.sku,color:p.color,qty_y:p.qty}}));
    pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${p.sku}（${p.color}）${stockText(res,r)}`,{tag:'庫存結果',payload:{...res},internal:['availableY','rolls','reservedY'],src:'快照計算'}));
    let draftBiz,draftCust;
    if(res.sufficient){
      draftBiz=`回覆草稿：${nm(p.sku)}（${p.color}）現貨可供 ${p.qty}Y，可於確認訂單後安排出貨。`;
      draftCust=`回覆草稿：${nm(p.sku)}（${p.color}）有現貨，可於確認訂單後安排出貨。`;
    }else{
      const short=p.qty-res.availableY;
      const cands=(SIMILAR[p.sku]||['3760','S75']).filter(s=>s!==p.sku);
      const cres=cands.map(s=>({s,r:queryInventory(s,p.color,short)}));
      pre.push(ev('inquiry','finder','請求','WORKING',`找與 ${p.sku} 光澤、垂墜相近的替代布（同色 ${p.color}）`,{tag:'找替代布',payload:{base:p.sku,color:p.color,need_y:short}}));
      pre.push(ev('finder','inventory','請求','WORKING',`查候選 ${cands.join('、')}（${p.color}）是否足夠 ${short}Y`,{tag:'查候選庫存',payload:{candidates:cands,color:p.color,need_y:short}}));
      pre.push(ev('inventory','finder','回覆','COMPLETED',r=>cres.map(x=>`${x.s}：${stockText(x.r,r)}`).join('；'),{tag:'候選結果',payload:Object.fromEntries(cres.map(x=>[x.s,{availableY:x.r.availableY,rolls:x.r.rolls,sufficient:x.r.sufficient}])),internal:cands,src:'快照計算'}));
      const ok=cres.filter(x=>x.r.sufficient).sort((a,b)=>(SCORE[b.s]?.[0]||0)-(SCORE[a.s]?.[0]||0));
      const best=ok[0];
      if(best){
        pre.push(ev('finder','inquiry','回覆','COMPLETED',`推薦 ${nm(best.s)}（相似度 ${SCORE[best.s][0]}%，${SCORE[best.s][1]}）${cands.filter(c=>c!==best.s).map(c=>`；${c} ${SCORE[c]?SCORE[c][1]:'相似度低'}，不建議`).join('')}`,{tag:'推薦替代',payload:{recommend:best.s,similarity:SCORE[best.s][0],reason:SCORE[best.s][1]},src:'劇本'}));
        pre.push(ev('inquiry','sample','請求','WORKING',`規劃 ${p.sku} 與 ${best.s} 的小片樣布`,{tag:'規劃寄樣',payload:{items:[p.sku,best.s],color:p.color}}));
        pre.push(ev('sample','inquiry','回覆','COMPLETED',`建議寄 ${p.sku}、${best.s} A4 樣布各 1 片，附香檳色卡 C4`,{tag:'寄樣建議',payload:{swatch:'A4 x2',color_card:'C4'}}));
        draftBiz=`回覆草稿：${p.sku} 現貨 ${res.availableY}Y，不足 ${short}Y 建議以 ${nm(best.s)} 補足；附寄樣建議。`;
        draftCust=`回覆草稿：${p.sku} 部分現貨，其餘建議以 ${nm(best.s)} 替代；附寄樣建議。`;
      }else{
        pre.push(ev('finder','inquiry','回覆','COMPLETED',`候選款皆無足量現貨，建議以訂製處理`,{tag:'無替代',payload:{recommend:null},src:'劇本'}));
        draftBiz=`回覆草稿：${p.sku} 現貨 ${res.availableY}Y，其餘 ${short}Y 需訂製，交期另行確認。`;
        draftCust=`回覆草稿：${p.sku} 需訂製，交期另行確認。`;
      }
    }
    pre.push(ev('inquiry','sales','等待人工','INPUT_REQUIRED',r=>r==='biz'?draftBiz:draftCust,{tag:'草稿待確認',payload:{draft:draftBiz},internal:['draft']}));
    return {pre,post:k=>[
      ev('sales','inquiry','回覆','COMPLETED',k==='modify'?'修改一句後核准送出':'核准送出',{tag:'業務核准',src:'人工',dt:700}),
      ev('inquiry','customer','回覆','COMPLETED','回覆信已寄出，副本存入詢價紀錄',{tag:'已寄出'})],
      revise:'修正後的回覆草稿（已補上交期說明）'};
  }},
 {key:'s2',name:'情境 2｜多品項詢價平行查詢',lanes:['customer','inquiry','inventory','sales'],
  desc:'一封信同時詢問三款布。詢價代理人同時發出三個查詢，回覆先後不一，全部回來後才彙整成一份草稿。',
  build(){
    const items=[['S75','CHAMPAGNE'],['3760','CHAMPAGNE'],['KK98','WHITE']];
    const rs=items.map(([s,c])=>({s,c,r:queryInventory(s,c,200)}));
    const pre=[ev('customer','inquiry','請求','SUBMITTED','來信：S75、3760、KK98 各 200Y',{tag:'客戶來信',payload:{items:items.map(i=>i[0]),qty_y_each:200},dt:600})];
    rs.forEach((x,i)=>pre.push(ev('inquiry','inventory','請求','WORKING',`查 ${x.s}（${x.c}）200Y`,{tag:`平行查詢 ${i+1}/3`,group:'平行',payload:{item:x.s,color:x.c,qty_y:200},dt:i?180:900})));
    [1,2,0].forEach((i,k)=>{const x=rs[i];pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${x.s}（${x.c}）${stockText(x.r,r)}`,{tag:`回覆 ${x.s}`,group:'平行',payload:{...x.r},internal:['availableY','rolls','reservedY'],src:'快照計算',dt:k?700:1400}))});
    const okN=rs.filter(x=>x.r.sufficient).length;
    const draft=r=>`彙整草稿：${rs.map(x=>`${x.s} ${stockText(x.r,r,200)}`).join('；')}`;
    pre.push(ev('inquiry','sales','等待人工','INPUT_REQUIRED',draft,{tag:'彙整待確認',payload:{in_stock:okN,made_to_order:3-okN}}));
    return {pre,post:k=>[ev('sales','inquiry','回覆','COMPLETED',k==='modify'?'調整說明後核准送出':'核准送出',{tag:'業務核准',src:'人工',dt:700}),ev('inquiry','customer','回覆','COMPLETED','三款的回覆已合併成一封信寄出',{tag:'已寄出'})],revise:'修正後的彙整草稿'};

 {key:'s3',name:'情境 3｜看圖找布＋現貨標示',lanes:['designer','finder','inventory'],
  desc:'設計師上傳禮服照。選布代理人判讀後推薦相似布款，再請庫存代理人逐款標示現貨，有現貨的排前面。此情境沒有人工確認點。',
  build(){
    const cands=['S75','3760','630-1GU','KK98','N120'];
    const rs=cands.map(s=>({s,r:queryInventory(s,'CHAMPAGNE',1)}));
    const ranked=[...rs].sort((a,b)=>(b.r.hasStock-a.r.hasStock)||(SCORE[b.s][0]-SCORE[a.s][0]));
    const pre=[
      ev('designer','finder','請求','SUBMITTED','上傳禮服照：香檳色緞面、拖尾',{tag:'上傳照片',payload:{image:'gown_champagne.jpg'},dt:600}),
      ev('finder','finder','呼叫工具','WORKING','判讀照片：高光澤、垂墜、香檳色',{tag:'AI 判讀',payload:{luster:'高',drape:'佳',color:'CHAMPAGNE'}}),
      ev('finder','inventory','請求','WORKING',`查推薦前 5 款的香檳色現貨：${cands.join('、')}`,{tag:'查 5 款現貨',payload:{candidates:cands,color:'CHAMPAGNE'}}),
      ev('inventory','finder','回覆','COMPLETED',r=>rs.map(x=>`${x.s} ${r==='biz'?(x.r.hasStock?x.r.availableY+'Y':'0Y'):(x.r.hasStock?'有現貨':'需訂製')}`).join('、'),{tag:'現貨結果',payload:Object.fromEntries(rs.map(x=>[x.s,{availableY:x.r.availableY,hasStock:x.r.hasStock}])),internal:cands,src:'快照計算'}),
      ev('finder','designer','回覆','COMPLETED',`推薦結果（有現貨優先）：${ranked.map((x,i)=>`${i+1}. ${nm(x.s)} ${SCORE[x.s][0]}%${x.r.hasStock?'':'（需訂製）'}`).join('　')}`,{tag:'推薦清單',payload:{ranking:ranked.map(x=>x.s)}})
    ];
    return {pre,post:()=>[]};
  }},
 {key:'s4',name:'情境 4｜樣品申請 AI 審核',lanes:['customer','sample','inventory','sales'],
  desc:'客戶送出樣品申請。寄樣代理人先確認每款樣布剪得出來，再給業務審核建議；剪不出來的改建議寄色卡。',
  build(){

 {key:'cs',case:'sample_request',name:'樣品申請',lanes:['customer','sample','inventory','sales'],desc:'',

    /* 寫進客戶「我的申請」的審核說明：只寫客戶需要知道的（新客戶提醒、庫存量等內部建議留在協作中心） */

    return {pre,post:k=>[ev('sales','sample','回覆','COMPLETED',k==='modify'?'修改審核建議後核准':'核准',{tag:'業務核准',src:'人工',dt:700}),

      revise:'修正後的審核建議（已依退回意見調整）',note:rec,customerNote:cnote,

  }},

/* 詢價（延伸情境 1、2）：業務把客戶來信帶進選布平台（詢價單）→ 依品項查 ERP 現貨（多款時平行查詢）→ 不足時以選布平台的
   相似款找替代布 → 回覆草稿（業務視角中文；寄給客戶的信用詢價單的語言）→ 業務核准後寫進詢價單並標為已確認（不自動寄出）。
   路線由資料決定：現貨足量（1a）／不足但有替代（1b）／沒有替代轉訂製（1c）／一次問多款（2）。 */
/* 詢價單缺少的欄位（選布平台 core/tenant/schema.ts 的 INQUIRY_FIELDS） */
const MISS={company:'公司',contact:'聯絡人',email:'email',article_no:'貨號',quantity:'數量',unit:'單位',delivery_date:'交期',use:'用途',destination:'目的地',samples:'是否要樣品'};
const MISS_EN={company:'company name',contact:'contact person',email:'e-mail',article_no:'article numbers',quantity:'quantities',unit:'units',delivery_date:'delivery date',use:'intended use',destination:'destination',samples:'whether you need samples'};
function inquiryCase(c){
  const i=c.input||{},cust=custName(c),en=i.lang==='en';
  const all=(i.items||[]).slice(0,8),known=all.filter(x=>x.known),unknown=all.filter(x=>!x.known);
  AG.customer.name=(i.customer&&(i.customer.company||i.customer.name||i.customer.email))||'客戶';
  const qtyTxt=x=>x.qty!=null?`${x.qty}${x.unit==='m'?' m':x.unit==='yd'||!x.unit?'Y':' '+x.unit}`:'（未寫數量）';
  const pre=[ev('customer','inquiry','請求','SUBMITTED',`來信「${i.subject||'（無主旨）'}」：${all.map(x=>`${x.article_no}${x.known?` ${x.name}`:'（型錄找不到）'} ${qtyTxt(x)}`).join('、')||'沒有寫明品項'}${i.delivery_date?`；交期 ${i.delivery_date}`:''}${i.use?`；用途 ${i.use}`:''}`,{tag:'客戶來信',mod:'plat',src:`選布平台（詢價單 #${i.inquiry_id}）`,payload:{inquiry_id:i.inquiry_id,items:all.map(x=>({article_no:x.article_no,qty:x.qty,unit:x.unit}))},dt:600})];
  pre.push(ev('inquiry','inquiry','呼叫工具','WORKING',`解析來信：${cust}，${all.length} 個品項（${known.length} 個在型錄中）${(i.missing||[]).length?`；缺少：${i.missing.map(m=>MISS[m]||m).join('、')}`:''}`,{tag:'解析來信',payload:{missing:i.missing||[]},src:'選布平台'}));
  const need=m=>m.x.qty_y||1;
  const res=known.map(x=>({x,...erpFor(x.article_no)})).map(m=>({...m,r:queryInventory(m.sku,m.color,need(m))}));
  const par=res.length>1;
  res.forEach((m,k)=>pre.push(ev('inquiry','inventory','請求','WORKING',`查 ${m.x.article_no} → ${m.sku}（${m.color}）可用庫存，需求 ${m.x.qty_y!=null?m.x.qty_y+'Y':'（未寫數量）'}`,{tag:par?`平行查詢 ${k+1}/${res.length}`:'查庫存',group:par?'平行':'',payload:{article_no:m.x.article_no,erp:m.sku,color:m.color,qty_y:m.x.qty_y},src:'示範對應（選布平台貨號尚未對應 ERP 品號）',dt:k?180:900})));
  res.forEach((m,k)=>pre.push(ev('inventory','inquiry','回覆','COMPLETED',r=>`${m.x.article_no}（${m.sku} ${m.color}）${stockText(m.r,r,need(m))}`,{tag:par?`回覆 ${m.x.article_no}`:'庫存結果',group:par?'平行':'',payload:{...m.r},internal:['availableY','rolls','reservedY'],src:'ERP 快照計算',dt:k?400:1100})));
  const lines=[];let usedFinder=false;
  for(const m of res){
    const qy=need(m);
    if(m.r.availableY>=qy){lines.push({m,kind:'ok'});continue}
    const short=qy-m.r.availableY,alts=((i.alternatives||{})[m.x.article_no]||[]).slice(0,2);
    if(!alts.length){lines.push({m,kind:'mto',short});continue}
    usedFinder=true;
    const am=alts.map(a=>({a,...erpFor(a.article_no)})).map(a=>({...a,r:queryInventory(a.sku,a.color,short)}));
    pre.push(ev('inquiry','finder','請求','WORKING',`${m.x.article_no} 不足 ${short}Y，找相近的替代布`,{tag:'找替代布',payload:{base:m.x.article_no,need_y:short}}));
    pre.push(ev('finder','inventory','請求','WORKING',`查候選 ${am.map(a=>`${a.a.article_no}（相似度 ${a.a.match_pct}%）`).join('、')} 是否足夠 ${short}Y`,{tag:'查候選庫存',payload:{candidates:am.map(a=>a.a.article_no),need_y:short}}));
    pre.push(ev('inventory','finder','回覆','COMPLETED',r=>am.map(a=>`${a.a.article_no}：${stockText(a.r,r,short)}`).join('；'),{tag:'候選結果',payload:Object.fromEntries(am.map(a=>[a.a.article_no,{availableY:a.r.availableY,sufficient:a.r.sufficient}])),internal:am.map(a=>a.a.article_no),src:'ERP 快照計算'}));
    const best=am.find(a=>a.r.sufficient);
    pre.push(ev('finder','inquiry','回覆','COMPLETED',best?`建議以 ${best.a.article_no} ${best.a.name}（相似度 ${best.a.match_pct}%）補足 ${short}Y`:'候選款都沒有足量現貨，建議訂製',{tag:best?'推薦替代布':'無替代',payload:{recommend:best?best.a.article_no:null}}));
    lines.push(best?{m,kind:'alt',short,alt:best.a}:{m,kind:'mto',short});
  }
  this.lanes=usedFinder?['customer','inquiry','inventory','finder','sales']:['customer','inquiry','inventory','sales'];
  const miss=(i.missing||[]).map(m=>MISS[m]||m);
  // 完全沒有現貨（availableY 0）時說「無現貨」，不說「部分現貨」
  const none=l=>!l.m.r.availableY;
  const bizLine=l=>l.kind==='ok'?`${l.m.x.article_no} 現貨足夠`:l.kind==='alt'?(none(l)?`${l.m.x.article_no} 無現貨，以 ${l.alt.article_no} 替代 ${l.short}Y`:`${l.m.x.article_no} 現貨 ${l.m.r.availableY}Y，不足 ${l.short}Y 以 ${l.alt.article_no} 補足`):`${l.m.x.article_no} ${l.m.r.availableY?`現貨 ${l.m.r.availableY}Y，其餘 ${l.short}Y 訂製`:'需訂製'}`;
  const custLine=l=>l.kind==='ok'?`${l.m.x.article_no} 有現貨`:l.kind==='alt'?(none(l)?`${l.m.x.article_no} 無現貨，建議以 ${l.alt.article_no} 替代`:`${l.m.x.article_no} 部分現貨，其餘建議以 ${l.alt.article_no} 替代`):`${l.m.x.article_no} 需訂製`;
  const biz=`回覆草稿：${[...lines.map(bizLine),...unknown.map(u=>`${u.article_no} 型錄找不到，請客戶確認`)].join('；')||'沒有可查的品項'}${miss.length?`；請客戶補充：${miss.join('、')}`:''}`;
  const cus=`回覆草稿：${[...lines.map(custLine),...unknown.map(u=>`${u.article_no} 請客戶再確認貨號`)].join('；')||'請客戶提供品項'}${miss.length?`；請客戶補充：${miss.join('、')}`:''}`;
  const who=(i.customer&&i.customer.name)||'';
  // 英文信只寫貨號（型錄名稱是中文）
  const enLine=l=>l.kind==='ok'?`- ${l.m.x.article_no}: available from stock.`:l.kind==='alt'?(none(l)?`- ${l.m.x.article_no}: not in stock; we suggest ${l.alt.article_no} instead, available now.`:`- ${l.m.x.article_no}: ${l.m.r.availableY} yd in stock; for the remaining ${l.short} yd we suggest ${l.alt.article_no}, available now.`):`- ${l.m.x.article_no}: made to order; we will confirm the lead time.`;
  const zhLine=l=>l.kind==='ok'?`・${l.m.x.article_no} ${l.m.x.name}：有現貨。`:l.kind==='alt'?(none(l)?`・${l.m.x.article_no}：目前無現貨，建議以 ${l.alt.article_no}（${l.alt.name}）替代，目前有現貨。`:`・${l.m.x.article_no}：現貨 ${l.m.r.availableY} 碼，其餘 ${l.short} 碼建議以 ${l.alt.article_no}（${l.alt.name}）替代，目前有現貨。`):`・${l.m.x.article_no}：需訂製，交期另行確認。`;
  const reply=en
    ?`Dear ${who||'Sir or Madam'},\n\nThank you for your inquiry${i.subject?` (${i.subject})`:''}.\n\n${[...lines.map(enLine),...unknown.map(u=>`- ${u.article_no}: we could not find this article; could you check the number?`)].join('\n')}\n${(i.missing||[]).length?`\nCould you also let us know the ${(i.missing||[]).map(m=>MISS_EN[m]||m).join(', ')}?\n`:''}\nBest regards`
    :`${who||'您好'}：\n\n感謝您的詢價${i.subject?`（${i.subject}）`:''}。\n\n${[...lines.map(zhLine),...unknown.map(u=>`・${u.article_no}：型錄中找不到此貨號，請再確認。`)].join('\n')}\n${miss.length?`\n另請提供：${miss.join('、')}。\n`:''}\n敬祝 商祺`;
  this.desc=`${cust} 來信詢價，業務帶進選布平台（詢價單 #${i.inquiry_id}）。詢價代理人依品項查 ERP 現貨${par?'（多款平行查詢）':''}，不足時請選布代理人找替代布；業務核准後，回覆草稿寫進詢價單並標為已確認，業務在詢價頁按「寄出」才會寄給客戶。`;
  pre.push(ev('inquiry','sales','等待人工','INPUT_REQUIRED',r=>r==='biz'?biz:cus,{tag:'草稿待確認',payload:{draft:biz,reply_lang:i.lang},internal:['draft'],final:true}));
  return {pre,post:k=>[ev('sales','inquiry','回覆','COMPLETED',k==='modify'?'修改一句後核准':'核准回覆草稿',{tag:'業務核准',src:'人工',dt:700}),
    ev('inquiry','customer','回覆','COMPLETED',`回覆草稿已寫進詢價單 #${i.inquiry_id} 並標為已確認（標示「AI推薦草稿」，寄給客戶的信不含這個標示）；業務在詢價頁按「寄出」即寄給客戶`,{tag:'回寫選布平台',mod:'plat'})],
    revise:'修正後的回覆草稿（已補上交期說明）',note:biz,reply,declineNote:'不回覆此詢價',declineText:`已結案；詢價單 #${i.inquiry_id} 維持原狀，由業務自行處理`};
}
/* 建檔新布（延伸情境 5）：業務在選布平台上架新布（上架即生效）→ 建檔代理人判讀屬性，同時對 ERP 品號與捲數、
   以選布平台的評分找最相似的 3 款 → 吻合度 90% 以上視為疑似重複（5b），否則正常（5a）→ 業務確認維持上架，婉拒則下架。 */
function newFabricCase(c){
  const i=c.input||{},sim=(i.similar||[]).slice(0,3),dup=!!i.duplicate&&!!sim[0];
  const m=erpFor(i.article_no),r=queryInventory(m.sku,m.color,1);
  this.desc=`${i.published_by||'業務'} 在選布平台上架新布 ${i.article_no}（${i.name}）。建檔代理人判讀屬性，同時請庫存代理人對 ERP 品號與現有捲數、請選布代理人找最相似的布款；${dup?'發現疑似重複，':''}業務確認後維持上架，婉拒則下架。`;
  const pre=[
    ev('sales','catalog','請求','SUBMITTED',`${i.published_by||'業務'} 上架新布 ${i.article_no} ${i.name}`,{tag:'上架新布',mod:'plat',src:'選布平台',payload:{article_no:i.article_no},dt:600}),
    ev('catalog','catalog','呼叫工具','WORKING',`判讀屬性：${critText({fabric_type:i.fabric_type,color_family:i.color_family,construction:i.construction})}`,{tag:'判讀屬性',payload:{fabric_type:i.fabric_type,color_family:i.color_family,construction:i.construction},src:'選布平台'}),
    ev('catalog','inventory','請求','WORKING',`查 ${i.article_no} 對應的 ERP 品號與現有捲數`,{tag:'查品號庫存',group:'平行',payload:{article_no:i.article_no}}),
    ev('catalog','finder','請求','WORKING','找最相似的 3 款，避免重複上架',{tag:'找相似款',group:'平行',payload:{article_no:i.article_no},dt:200}),
    ev('inventory','catalog','回覆','COMPLETED',x=>`對應 ERP ${nm(m.sku)}（${m.color}）；${x==='biz'?`現有 ${r.rolls} 捲 ${r.availableY}Y`:(r.hasStock?'有現貨':'需訂製')}`,{tag:'品號結果',group:'平行',payload:{erp:m.sku,color:m.color,rolls:r.rolls,availableY:r.availableY},internal:['rolls','availableY'],src:'示範對應（選布平台貨號尚未對應 ERP 品號）'}),
    ev('finder','catalog','回覆','COMPLETED',sim.length?`相似款：${sim.map(s=>`${s.article_no} ${s.name}（${s.match_pct}%）`).join('、')}${dup?`；${sim[0].article_no} 吻合 ${sim[0].match_pct}%，疑似重複`:'；沒有重複品項'}`:'目錄中沒有相似的布款',{tag:'相似款結果',group:'平行',payload:{similar:sim},src:'選布平台'})
  ];
  const rec=dup?`疑似和 ${sim[0].article_no} ${sim[0].name} 重複（吻合 ${sim[0].match_pct}%）。請確認是否保留；婉拒會把 ${i.article_no} 下架`:`建檔檢查完成：屬性已判讀、ERP 對應 ${m.sku}、沒有重複品項，請確認上架`;
  pre.push(ev('catalog','sales','等待人工','INPUT_REQUIRED',rec,{tag:dup?'疑似重複待確認':'建檔待確認',payload:{duplicate:dup,similar:sim.map(s=>s.article_no)},final:true}));
  return {pre,post:k=>[ev('sales','catalog','回覆','COMPLETED',k==='modify'?'調整屬性後確認上架':'確認上架',{tag:'業務核准',src:'人工',dt:700}),
    ev('catalog','sales','狀態變更','COMPLETED',`${i.article_no} 維持在選布平台上架`,{tag:'維持上架',mod:'plat'})],
    revise:'修正後的建檔檢查',note:rec,declineNote:dup?`與 ${sim[0].article_no} 重複`:'不上架',declineText:`已在選布平台下架 ${i.article_no}`};
}
/* 寄樣回饋：客戶收到樣品後在「我的申請」逐款回饋（符合／接近／不符、方向）→ 寄樣代理人整理 → 符合的查下單庫存、
   不符的請選布代理人找相近的替代布 → 下一步建議；業務核准後替代布加進「我的收藏」（AI推薦），申請單寫上給客戶看的下一步。 */
const ASPECT_ZH={color:'顏色',hand:'手感',stiffness:'挺度',sheen:'光澤',drape:'垂墜',overall:'整體'},VERDICT_ZH={match:'符合',close:'接近',mismatch:'不符'};
function feedbackCase(c){
  const i=c.input||{},cust=custName(c),items=(i.items||[]).slice(0,8);
  AG.customer.name=(i.customer&&(i.customer.company||i.customer.name))||'客戶';
  const fbText=it=>(it.feedback||[]).map(x=>`${ASPECT_ZH[x.aspect]||x.aspect}${VERDICT_ZH[x.verdict]||x.verdict}${x.direction?`（${x.direction}）`:''}`).join('、');
  const ok=items.filter(it=>(it.feedback||[]).every(x=>x.verdict==='match')),off=items.filter(it=>!(it.feedback||[]).every(x=>x.verdict==='match'));
  this.desc=`${cust} 收到樣品申請 #${i.request_id} 的樣品後，在選布平台回饋了 ${items.length} 款。寄樣代理人整理回饋：符合的查下單庫存，不符的請選布代理人找相近的替代布；業務核准後，替代布加進客戶的「我的收藏」，申請單寫上給客戶看的下一步。`;
  const pre=[ev('customer','sample','請求','SUBMITTED',`樣品申請 #${i.request_id} 的回饋：${items.map(it=>`${it.article_no} ${fbText(it)}`).join('；')}`,{tag:'樣品回饋',mod:'plat',src:'選布平台',payload:{request_id:i.request_id,items:items.map(it=>({article_no:it.article_no,feedback:it.feedback}))},dt:600})];
  pre.push(ev('sample','sample','呼叫工具','WORKING',`整理回饋：${ok.length} 款符合${off.length?`，${off.length} 款需要調整（${off.map(x=>x.article_no).join('、')}）`:''}`,{tag:'整理回饋',payload:{match:ok.map(x=>x.article_no),adjust:off.map(x=>x.article_no)}}));
  const okRes=ok.map(it=>({it,...erpFor(it.article_no)})).map(m=>({...m,r:queryInventory(m.sku,m.color,100)}));
  if(okRes.length){
    pre.push(ev('sample','inventory','請求','WORKING',`查符合款的下單庫存（以 100Y 估）：${okRes.map(m=>`${m.it.article_no} → ${m.sku}（${m.color}）`).join('、')}`,{tag:'查下單庫存',payload:{items:okRes.map(m=>m.it.article_no),need_y:100}}));
    pre.push(ev('inventory','sample','回覆','COMPLETED',r=>okRes.map(m=>`${m.it.article_no}：${stockText(m.r,r,100)}`).join('；'),{tag:'庫存結果',payload:Object.fromEntries(okRes.map(m=>[m.it.article_no,{availableY:m.r.availableY}])),internal:['availableY']}));
  }
  const picks=[],lines=[];
  for(const it of off){
    const colourOff=(it.feedback||[]).some(x=>x.aspect==='color'&&x.verdict!=='match');
    const alts=(it.alternatives||[]).slice(0,3).map(a=>({a,...erpFor(a.article_no)})).map(a=>({...a,r:queryInventory(a.sku,a.color,1)}));
    pre.push(ev('sample','finder','請求','WORKING',`${it.article_no} ${fbText(it)}，找相近的替代布`,{tag:'找替代布',payload:{base:it.article_no,feedback:it.feedback}}));
    if(alts.length){
      pre.push(ev('finder','inventory','請求','WORKING',`查候選 ${alts.map(a=>`${a.a.article_no}（相似度 ${a.a.match_pct}%）`).join('、')} 的現貨`,{tag:'查候選庫存',payload:{candidates:alts.map(a=>a.a.article_no)}}));
      pre.push(ev('inventory','finder','回覆','COMPLETED',r=>alts.map(a=>`${a.a.article_no}：${a.r.hasStock?(r==='biz'?`可用 ${a.r.availableY}Y`:'有現貨'):'需訂製'}`).join('；'),{tag:'候選結果',payload:Object.fromEntries(alts.map(a=>[a.a.article_no,{hasStock:a.r.hasStock}]))}));
    }
    const best=alts.find(a=>a.r.hasStock)||alts[0];
    pre.push(ev('finder','sample','回覆','COMPLETED',best?`建議以 ${best.a.article_no} ${best.a.name}（相似度 ${best.a.match_pct}%）替代${colourOff?'；顏色也可用 ColorMind 另打色樣':''}`:`沒有相近的替代布${colourOff?'，建議用 ColorMind 打色樣':'，建議業務親自了解需求'}`,{tag:best?'推薦替代布':'無替代',payload:{base:it.article_no,alternative:best?best.a.article_no:null}}));
    if(best&&!picks.includes(best.a.article_no))picks.push(best.a.article_no);
    lines.push({it,best,colourOff});
  }
  const biz=`下一步建議：${[ok.length?`${ok.map(x=>x.article_no).join('、')} 符合，建議業務報價`:'',...lines.map(l=>l.best?`${l.it.article_no} 改推 ${l.best.a.article_no}`:`${l.it.article_no} ${l.colourOff?'改用 ColorMind 打色樣':'由業務了解需求'}`)].filter(Boolean).join('；')}${picks.length?`；核准後把 ${picks.join('、')} 加進客戶的「我的收藏」`:''}`;
  /* 寫在客戶申請單上的下一步：只寫客戶需要知道的 */
  const cnote=[ok.length?`${ok.map(x=>x.article_no).join('、')} 符合您的需求，業務會盡快與您聯絡報價`:'',...lines.map(l=>l.best?`${l.it.article_no} 與您的期望有落差，已將相近的 ${l.best.a.article_no} 加入您的收藏`:l.colourOff?`${l.it.article_no} 的顏色可依您的需求另打色樣，業務會與您確認`:`${l.it.article_no} 業務會再與您確認需求`)].filter(Boolean).join('；')+'。';
  pre.push(ev('sample','sales','等待人工','INPUT_REQUIRED',biz,{tag:'下一步待確認',payload:{match:ok.map(x=>x.article_no),picks},final:true}));
  return {pre,post:k=>[ev('sales','sample','回覆','COMPLETED',k==='modify'?'修改後核准':'核准',{tag:'業務核准',src:'人工',dt:700}),
    ev('sample','customer','回覆','COMPLETED',`申請 #${i.request_id} 已寫上下一步；客戶在「我的申請」看到：「AI推薦：${cnote}」${picks.length?`；${picks.join('、')} 加進「我的收藏」，標示「AI推薦」`:''}`,{tag:'回寫選布平台',mod:'plat'})],
    revise:'修正後的下一步建議',note:biz,customerNote:cnote,articles:picks,declineNote:'暫不跟進',declineText:'已結案；選布平台不變'};
}
/* 展後跟進：業務在展會看板按「產生跟進建議」，每筆名單一件 → 詢價代理人整理買家在攤位掃過的布、查現貨、
   請選布代理人找相近款 → 擬跟進信（語言依買家）；業務核准後名單改為「已聯絡」，草稿寫進備註（不自動寄出）。 */
function leadCase(c){
  const i=c.input||{},cust=custName(c),fab=(i.fabrics||[]).slice(0,8),en=i.lang!=='zh',who=(i.customer&&i.customer.name)||'';
  AG.customer.name=(i.customer&&(i.customer.company||i.customer.name))||'買家';
  const show=i.show||{};
  this.desc=`業務把展會「${show.name||''}」的名單交給協作中心：${cust}${i.source==='scan'?` 在攤位掃了 ${fab.length} 款布`:'（業務手動新增的名單）'}。詢價代理人整理買家看過的布、查現貨、找相近款，擬一封跟進信；業務核准後，名單改為「已聯絡」，草稿寫進名單備註（不會自動寄出）。`;

const DEMO_ERP_MAP={"DT-C01B":["4034","正黑"],"DT-C02B":["3176-M2","丁香紫"],"DT-L01B":["3176-M2","丁香紫"],"DT-L02B":["4034","正黑"],"DT-L03B":["N447","奶油白"],"DT-L04B":["XO3004-2","深卡其"],"DT-M01B":["4278","正黑"],"DT-M01C":["4181","丁香紫"],"DT-S01B":["4034","正黑"],"DT-S01C":["N120","珍珠白"],"DT-S02B":["3176-M2","丁香紫"],"DT-T01B":["4287","正黑"],"PH-C01":["3810R","深卡其"],"PH-C02":["N120","珍珠白"],"PH-C03":["4034","正黑"],"PH-L01":["N120","珍珠白"],"PH-L02":["3810R","深卡其"],"PH-L03":["N423","鵝黃"],"PH-L04":["7764","象牙白"],"PH-L05":["4287","正黑"],"PH-L06":["4278","正黑"],"PH-L07":["4181","丁香紫"],"PH-L08":["7764","象牙白"],"PH-L09":["4287","正黑"],"PH-L10":["N447","奶油白"],"PH-L11":["XO3004-2","深卡其"],"PH-L12":["3176-M2","丁香紫"],"PH-M01":["8014-3","奶油白"],"PH-M02":["N447","奶油白"],"PH-M03":["XO3004-2","深卡其"],"PH-M04":["N120","珍珠白"],"PH-O01":["XO3004-2","深卡其"],"PH-O02":["3176-M2","丁香紫"],"PH-R01":["N447","奶油白"],"PH-R02":["8014-3","奶油白"],"PH-S01":["4278","正黑"],"PH-S02":["4287","正黑"],"PH-S03":["7764","象牙白"],"PH-S04":["N423","鵝黃"],"PH-S05":["3810R","深卡其"],"PH-T01":["3176-M2","丁香紫"],"PH-T02":["XO3004-2","深卡其"],"PH-T03":["N447","奶油白"],"PH-T04":["4034","正黑"]};
function erpFor(article,pool){
  if(!(pool&&pool.length)&&DEMO_ERP_MAP[article]){const [sku,color]=DEMO_ERP_MAP[article];return {sku,color}}
  const skus=(pool&&pool.length?pool:Object.keys(SNAPSHOT.items).filter(s=>colorsOf(s).length));
  const sku=skus[hashOf(article)%skus.length],cs=colorsOf(sku);
  return {sku,color:cs.length?cs[hashOf(article+'#')%cs.length]:'GREIGE'};
}
function parseLab(ref){const m=/Lab\s*(-?[\d.]+)\s*\/\s*(-?[\d.]+)\s*\/\s*(-?[\d.]+)/.exec(ref||'');return m?[+m[1],+m[2],+m[3]]:null}
const custName=c=>{const i=c&&c.input;if(c&&c.kind==='new_fabric')return (i&&i.published_by)||'業務';
  const u=i&&i.customer;if(!u)return '客戶';const who=u.name||u.email||'';return u.company?(who?`${who}（${u.company}）`:u.company):(who||'客戶')};
const caseScen=kind=>SCENARIOS.findIndex(s=>s.case===kind);
const isCase=()=>!!(S.case&&SCENARIOS[S.scen].case);
const caseTime=c=>new Date(String(c.created_at).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(c.created_at)?'':'Z'));

const S={scen:0,role:'cust',speed:1,events:[],shown:0,playing:false,timer:null,sel:null,plan:null,p:BRIDGE?BRIDGE.defaultInquiry:{sku:'S75',color:'CHAMPAGNE',qty:300},cp:{base:BRIDGE?BRIDGE.defaultBase:'S75',tkey:BRIDGE?BRIDGE.defaultTarget:'nude',custom:[80,8,14],qty:300},rejecting:false,typing:null,fresh:null,tab:'col',hl:{}};
const $=id=>document.getElementById(id);
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function start(atRest){
  clearTimeout(S.timer);uid=0;
  const sc=SCENARIOS[S.scen];
  resetColorDB();S.hl={};
  if(!sc.case)S.case=null;
  Object.entries(AG_DEFAULT).forEach(([k,n])=>{AG[k].name=n});
  S.plan=sc.case?sc.build(S.case):sc.build(sc.params==='color'?colorParams():S.p);
  S.events=S.plan.pre.slice();
  S.rejecting=false;S.typing=null;S.fresh=null;
  S.shown=0;S.playing=false;
  S.sel=null;S.decisions=[];S.cmWaiting=false;S.cmError=null;
  render();
  if(!atRest)syncPush();
}
function awaiting(){const e=S.events[S.shown-1];return !!e&&S.shown===S.events.length&&e.status==='INPUT_REQUIRED'&&!e.decided}
function isDone(){const hasHuman=S.events.some(e=>e.status==='INPUT_REQUIRED');return S.shown>0&&S.shown===S.events.length&&!awaiting()&&(!hasHuman||S.events.some(e=>e.decided))}
function schedule(ms){clearTimeout(S.timer);S.timer=setTimeout(()=>step(false),ms)}
function stopPlay(){S.playing=false;S.typing=null;clearTimeout(S.timer)}
function step(manual){
  if(awaiting()||S.shown>=S.events.length){S.playing=false;S.typing=null;render();return}
  const next=S.events[S.shown];
  if(!manual&&!REDUCE&&S.typing!==next){S.typing=next;render();schedule(Math.min(950,next.dt*0.65)/S.speed);return}
  S.typing=null;S.shown++;S.sel=next.id;S.fresh=next.id;if(next.onShow&&!next.applied){next.onShow();next.applied=true}if(next.hl){S.hl[next.hl.tab]=next.hl.key;S.tab=next.hl.tab}render();S.fresh=null;
  if(awaiting()){S.playing=false;renderControls();syncPush();if(isCase()&&S.events[S.shown-1].final)caseAction('wait');return}
  if(S.playing&&S.shown<S.events.length) schedule(Math.max(220,S.events[S.shown].dt*0.4)/S.speed);
  else {S.playing=false;renderControls();}
  syncPush();
}
/* 真的 ColorMind（嵌在 ERP 時）：人工步驟按「到 ColorMind 確認」→ ERP 後端簽發預測頁連結，開新分頁；
   使用者在 ColorMind 按「帶回配方」後回到 ERP（?code=…#/four-modules），ERP 換回配方，經 BroadcastChannel 交回這裡。
   只有開出分頁的這一邊會依結果往下走，另一邊經同步取得同一份配方（decisions 裡的 cm）。 */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function cmStepPending(){const e=S.events[S.shown-1];return awaiting()&&e&&e.stage==='colormind'}
async function openColorMind(){
  const cm=S.plan&&S.plan.match&&S.plan.match.cm;if(!cm||!cmStepPending())return;
  const win=window.open('','_blank');
  if(!win){S.cmError='瀏覽器擋下了新分頁，請允許本站開啟彈出視窗後再試';render();return}
  win.opener=null;try{win.document.title='ColorMind';win.document.body.textContent='正在開啟 ColorMind 預測畫面…'}catch(e){}
  S.cmError=null;S.cmWaiting=true;render();
  try{
    const r=await fetch('/api/colormind/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:[...cm.色樣名稱].slice(0,80).join(''),l:cm.L,a:cm.a,b:cm.b})});
    const body=await r.json().catch(()=>null);
    if(!r.ok||!body||!body.launch_url)throw new Error((body&&body.error)||`開啟 ColorMind 失敗（${r.status}）`);
    win.location.replace(body.launch_url);
  }catch(err){try{win.close()}catch(e){}S.cmWaiting=false;S.cmError=err.message||String(err);render()}
}
/* ColorMind 帶回的配方套進本案：劇本裡的文字與色彩資料庫分頁都讀同一個 cm 物件 */
function applyCM(res){
  const cm=S.plan&&S.plan.match&&S.plan.match.cm;if(!cm||!res||!Array.isArray(res.recipes))return;
  const n=v=>Number.isFinite(+v)?+v:0;
  if(typeof res['色樣名稱']==='string')cm.色樣名稱=res['色樣名稱'];
  cm.L=n(res.L);cm.a=n(res.a);cm.b=n(res.b);
  cm.recipes.length=0;cm.recipes.push(...res.recipes.slice(0,30).map((r,i)=>({序號:n(r['序號'])||i+1,C:n(r.C),M:n(r.M),Y:n(r.Y),K:n(r.K),R:n(r.R),G:n(r.G),B:n(r.B)})));
  cm.live=true;
}
function onColorMindMessage(m){
  if(!m||m.type!=='colormind-result'||!S.cmWaiting)return;
  S.cmWaiting=false;
  if(m.error||!m.result){S.cmError=m.error||'ColorMind 沒有帶回配方';render();return}
  if(!cmStepPending()||!m.result.recipes||!m.result.recipes.length){S.cmError='ColorMind 沒有帶回配方';render();return}
  decide('approve','',{cm:m.result});
}
try{const ch=new BroadcastChannel('rorica-colormind');ch.onmessage=e=>onColorMindMessage(e.data)}catch(e){}
window.addEventListener('storage',e=>{if(e.key!=='rorica-colormind-result'||!e.newValue)return;try{onColorMindMessage(JSON.parse(e.newValue))}catch(x){}});

/* 退回：重送同一關（stage 沿用），文字用該關自己的 revise，沒有就用劇本的預設 */
function rejectEvents(e,reason){
  return [ev('sales',e.from,'回覆','WORKING','退回：'+reason,{tag:'業務退回',src:'人工',dt:500,payload:{reason}}),
    ev(e.from,'sales','等待人工','INPUT_REQUIRED',e.revise||S.plan.revise,{tag:e.stage==='colormind'?'ColorMind 待確認':'修正待確認',payload:{revised:true},stage:e.stage,revise:e.revise,final:e.final})];
}
/* 婉拒（只有案件的最後一關有）：結案不處理；選布平台依案件種類寫回（樣品申請→已婉拒、新布→下架，其他只結案） */
function declineEvents(e){
  const client=SCENARIOS[S.scen].lanes[0];
  return [ev('sales',e.from,'回覆','CANCELED',`婉拒：${S.plan.declineNote||'不處理此案'}`,{tag:'業務婉拒',src:'人工',dt:700}),
    ev(e.from,client,'回覆','COMPLETED',S.plan.declineText||'已結案，選布平台不變',{tag:'回寫選布平台',mod:'plat'})];
}
/* 業務的決定之後接什麼：退回 → 重送同一關；婉拒 → 結案；核准／修改後核准 → 劇本自己的後續 */
function decisionEvents(kind,e,reason){
  if(kind==='reject')return rejectEvents(e,reason);
  if(kind==='decline')return declineEvents(e);
  return S.plan.post(kind,e);
}
function decide(kind,reason,extra){
  const e=S.events[S.shown-1];e.decided=kind;S.decisions.push(Object.assign({kind,reason:reason||''},extra||{}));
  S.cmWaiting=false;S.cmError=null;
  if(extra&&extra.cm)applyCM(extra.cm);
  S.events.push(...decisionEvents(kind,e,reason));
  S.rejecting=false;S.playing=true;S.typing=null;render();schedule(350/S.speed);
  syncPush(true);
  // 案件的最後一關：業務核准（或修改後核准）由選布平台寫回（申請單改為已核准／建立打色樣申請）；只有按下的這個畫面送
  if(isCase()&&e.final&&kind!=='reject')caseAction('decide',{decision:kind,
    note:kind==='decline'?`業務婉拒：${S.plan.declineNote||S.plan.note}`:kind==='modify'?`${S.plan.note}（業務修改後核准）`:S.plan.note,
    articles:S.plan.articles||[],reply:S.plan.reply||'',customer_note:S.plan.customerNote||''});
}

function boardState(){
  const st={};BOARD.forEach(a=>st[a]={s:'idle',t:'閒置'});
  const seen=new Set();
  S.events.slice(0,S.shown).forEach(e=>{
    seen.add(e.from);seen.add(e.to);
    if(e.status==='INPUT_REQUIRED'){if(st[e.to])st[e.to]={s:'INPUT_REQUIRED',t:'需要確認'};if(st[e.from])st[e.from]={s:'wait',t:'等待確認'};return}
    if(e.type==='請求'){if(st[e.to])st[e.to]={s:'WORKING',t:'處理中'};if(st[e.from]&&e.from!==e.to)st[e.from]={s:'wait',t:'等待回覆'};}
    else if(e.type==='呼叫工具'){if(st[e.from])st[e.from]={s:'WORKING',t:'處理中'};}
    else{if(st[e.from])st[e.from]={s:'COMPLETED',t:'完成'};if(st[e.to]&&e.status!=='WORKING')st[e.to]={s:'WORKING',t:'處理中'};if(st[e.to]&&e.status==='WORKING')st[e.to]={s:'WORKING',t:'修正中'};}
  });
  if(isDone()){BOARD.forEach(a=>{if(st[a].s!=='idle')st[a]={s:'COMPLETED',t:'完成'}});}
  return {st,seen};
}
const stc={idle:'--st-sub',wait:'--st-sub',WORKING:'--st-work',INPUT_REQUIRED:'--st-wait',COMPLETED:'--st-ok'};
function verb(e){return e.status==='INPUT_REQUIRED'?'送交確認':e.type==='請求'?'交辦':e.type==='呼叫工具'?'自行處理':'回覆'}

function renderBoard(){
  const {st}=boardState();const lanes=SCENARIOS[S.scen].lanes;
  const act={},cls={};
  if(S.typing){const t=S.typing;cls[t.from]='speaking';act[t.from]=t.from===t.to?'正在處理…':`正在${verb(t)}給 ${AG[t.to].name}…`;}
  else if(S.shown&&!isDone()){const e=S.events[S.shown-1];
    if(e.from!==e.to){cls[e.to]='receiving';act[e.to]=e.status==='INPUT_REQUIRED'?'等你確認':`收到 ${AG[e.from].name} 的${e.type==='請求'?'請求':'回覆'}`;}
    cls[e.from]=cls[e.from]||'speaking';act[e.from]=act[e.from]||(e.from===e.to?'處理中':`剛${verb(e)}給 ${AG[e.to].name}`);}
  $('board').innerHTML=BOARD.map(a=>{const g=AG[a],s=st[a];const live=s.s==='WORKING'||s.s==='INPUT_REQUIRED';const inL=lanes.includes(a);
    return `<div class="agent ${inL?'':'dim'} ${inL&&cls[a]?cls[a]:''}" style="--c:var(${g.c})"><div class="nm"><span class="dot" aria-hidden="true">${g.sh}</span>${g.name}</div><div class="role">${g.role}</div><span class="pill ${live?'live':''}" style="--sc:var(${stc[s.s]})">${inL?s.t:'本情境未參與'}</span><div class="act">${inL&&act[a]?act[a]:''}</div></div>`}).join('');

function evColor(e){return e.status==='INPUT_REQUIRED'?'--st-wait':(e.type==='請求'||e.type==='呼叫工具')?'--st-work':'--st-ok'}
function renderLanes(){

  const vis=S.events.slice(0,S.shown);

    s+=`<text x="8" y="${y+4}" font-size="11" fill="var(--ink-2)" class="mono">${String(i+1).padStart(2,'0')}</text><rect x="28" y="${y-6}" width="5" height="12" rx="2" fill="var(${MODS[modOf(e)].c})"><title>${MODS[modOf(e)].name}</title></rect>`;

    if(e.from===e.to){const x=cx(e.from);s+=`<path d="M${x} ${y-6} h22 v12 h-18" fill="none" stroke="${col}" stroke-width="1.6" ${fr?'class="lane-draw" style="--len:52"':''}/><path d="M${x+4} ${y+6} l6 -4 v8 z" fill="${col}"${fade}/><text x="${x+28}" y="${y+4}" font-size="11" fill="var(--ink-2)"${fade}>${e.tag}</text>`}
    else{const x1=cx(e.from),x2=cx(e.to),dir=x2>x1?1:-1,xe=x2-dir*5,len=Math.abs(xe-x1);
      const dash=e.status==='INPUT_REQUIRED';
      s+=`<line x1="${x1}" y1="${y}" x2="${xe}" y2="${y}" stroke="${col}" stroke-width="1.6" ${dash?'stroke-dasharray="5 3"':''} ${fr&&!dash?`class="lane-draw" style="--len:${len}"`:''}${fr&&dash?' class="lane-fade0"':''}/><path d="M${xe+dir*5} ${y} l${-dir*8} -4.5 v9 z" fill="${col}"${fade}/><circle cx="${x1}" cy="${y}" r="3" fill="${col}"/>`;
      if(fr)s+=`<circle cx="${x1}" cy="${y}" r="5" fill="${col}" opacity="0.9"><animate attributeName="cx" from="${x1}" to="${xe}" dur="0.55s" fill="freeze"/><animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.7;1" dur="0.8s" fill="freeze"/></circle>`;
      const mx=(x1+x2)/2;s+=`<text x="${mx}" y="${y-6}" font-size="11" text-anchor="middle" fill="var(--ink-2)"${fade}>${e.tag}</text>`}

  });
  if(S.typing){const t=S.typing,i=vis.length,y=headH+i*rowH+rowH/2+4,x1=cx(t.from),x2=cx(t.to),col=`var(${AG[t.from].c})`;
    s+=`<g class="lane-pending"><text x="8" y="${y+4}" font-size="11" fill="var(--ink-2)" class="mono">${String(i+1).padStart(2,'0')}</text>`;

    else{s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="1.2" stroke-dasharray="2 5" class="flow" opacity="0.7"/><circle cx="${x1}" cy="${y}" r="5" fill="${col}" class="ping" style="transform-origin:${x1}px ${y}px"/>`}

  s+='</svg>';$('lanes').innerHTML=s;
  $('lanes').querySelectorAll('.row-hit').forEach(g=>{g.addEventListener('click',()=>{S.sel=g.dataset.id;render()});g.addEventListener('keydown',k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();S.sel=g.dataset.id;render()}})});
}
/* 時間：案件從客戶在選布平台送出的時間起算（本機時區）；示範情境用固定的 14:02 起 */
function caseStamp(i){let t=0;for(let k=0;k<=i;k++)t+=Math.round(S.events[k].dt/300);return new Date(caseTime(S.case).getTime()+t*1000)}
const pad2=n=>String(n).padStart(2,'0');
function clock(i){if(isCase()){const d=caseStamp(i);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`}
  let t=0;for(let k=0;k<=i;k++)t+=Math.round(S.events[k].dt/300);const s=5+t;const m=2+Math.floor(s/60);return `14:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function dayOf(i){if(!isCase())return '2026-11-16';const d=caseStamp(i);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function who(a){const g=AG[a];return `<span class="who"><span class="dot" style="--c:var(${g.c})" aria-hidden="true">${g.sh}</span>${g.name}</span>`}
function renderThread(){
  const vis=S.events.slice(0,S.shown);let html='';let owner=null;
  vis.forEach((e,i)=>{
    if(e.type!=='回覆'&&e.from!==e.to&&e.to!==owner&&!['customer','designer'].includes(e.from)){html+=`<div class="handoff">交接：${AG[e.from].name} → ${AG[e.to].name}</div>`}

/* ===== 即時同步（選布平台 agent-hub 模組）=====
   嵌在 ERP 且有存取證時（window.parent.__AGENT_HUB__），情境、參數、播放到第幾步、人工決定與播放中與否
   都寫到選布平台的共用狀態，並即時接收別人的變更；ERP 與選布平台後台看到的是同一件案件。
   客戶／業務視角與播放速度各看各的，不同步。
   寫入以 rev 做 compare-and-set：同時按下時後到的一方收到 409 與目前狀態，改顯示對方的結果。
   自動播放只由按下播放的那個畫面推進（driver），其他畫面跟著顯示；driver 關掉或斷線 6 秒，另一個畫面接手。 */
const HUB=(()=>{try{const h=window.parent!==window?window.parent.__AGENT_HUB__:null;return h&&h.url&&h.token?h:null}catch(e){return null}})();
const ME=Math.random().toString(36).slice(2,10);
const SYNC={rev:0,applying:false,inFlight:false,dirty:false,lastAt:0,connected:false,expired:false,by:'',remote:null};
function syncSnapshot(){return {v:1,writer:ME,scen:S.scen,p:S.p,cp:S.cp,case:isCase()?{id:S.case.id,kind:S.case.kind,input:S.case.input,created_at:S.case.created_at}:null,shown:S.shown,decisions:S.decisions,playing:S.playing,driver:S.playing?ME:null}}
function syncBadge(){const b=$('sync');b.hidden=false;
  b.textContent=!HUB?'單機模式（未與選布平台同步）':SYNC.expired?'同步存取證已失效，請重新以選布平台帳號登入':SYNC.connected?`即時同步中${SYNC.by?'・最後操作：'+SYNC.by:''}`:SYNC.polling?`同步中（每 5 秒更新）${SYNC.by?'・最後操作：'+SYNC.by:''}`:'同步連線中…';}
/* mine：這次是本機使用者親手做的事（點開案件、核准／婉拒）。伺服器版本較新（409）時不讓舊的共用畫面蓋掉它，
   改以伺服器的最新版本號重送一次；其餘（播放進度等）照舊以伺服器為準 */
async function syncPush(mine){
  if(!HUB||SYNC.applying||SYNC.expired)return;
  if(mine)SYNC.mine=true;
  if(SYNC.inFlight){SYNC.dirty=true;return}
  const own=SYNC.mine;SYNC.mine=false;
  SYNC.inFlight=true;
  try{
    const r=await fetch(HUB.url+'/api/agent-hub/state',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+HUB.token},body:JSON.stringify({baseRev:SYNC.rev,state:syncSnapshot()})});
    const b=await r.json().catch(()=>null);
    if(r.ok&&b){SYNC.rev=b.rev;SYNC.by=b.updatedBy||'';SYNC.lastAt=Date.now();SYNC.remote=b.state}
    else if(r.status===409&&b&&own&&typeof b.rev==='number'){SYNC.rev=b.rev;SYNC.mine=true;SYNC.dirty=true}
    else if(r.status===409&&b){SYNC.dirty=false;syncApply(b)}
    else if(r.status===401){SYNC.expired=true}
  }catch(e){/* 斷線時本機照常操作，重新連上後以伺服器狀態為準 */}
  finally{SYNC.inFlight=false;syncBadge();if(SYNC.dirty){SYNC.dirty=false;syncPush()}}
}
function syncRebuild(st){
  S.scen=st.scen;S.p=st.p;S.cp=st.cp;S.case=st.case||null;$('scenario').value=SCENARIOS[st.scen].case?'':String(st.scen);
  uid=0;resetColorDB();S.hl={};
  Object.entries(AG_DEFAULT).forEach(([k,n])=>{AG[k].name=n});
  const sc=SCENARIOS[S.scen];S.plan=sc.case?sc.build(S.case||{}):sc.build(sc.params==='color'?colorParams():S.p);S.events=S.plan.pre.slice();
  renderParams();renderInbox();
  S.decisions=[];
  for(const d of st.decisions||[]){
    const e=[...S.events].reverse().find(x=>x.status==='INPUT_REQUIRED'&&!x.decided);if(!e)break;
    e.decided=d.kind;S.decisions.push(d);
    if(d.cm)applyCM(d.cm);
    S.events.push(...decisionEvents(d.kind,e,d.reason));
  }
}
function syncApply(snap){
  if(!snap||typeof snap.rev!=='number'||snap.rev<=SYNC.rev||!snap.state)return;
  SYNC.rev=snap.rev;SYNC.by=snap.updatedBy||'';SYNC.lastAt=Date.now();SYNC.remote=snap.state;
  // 自己寫的回推：本機畫面只會比它新（推送可能晚於本機下一步才到），只記版本、不覆蓋
  if(snap.state.writer===ME){syncBadge();return}
  const st=snap.state;SYNC.applying=true;
  try{
    const prevShown=S.shown;
    clearTimeout(S.timer);S.typing=null;S.rejecting=false;
    const sameCase=st.scen===S.scen&&JSON.stringify([st.p,st.cp,st.decisions,st.case&&st.case.id])===JSON.stringify([S.p,S.cp,S.decisions,isCase()?S.case.id:null]);
    if(!sameCase)syncRebuild(st);
    S.shown=Math.max(0,Math.min(st.shown|0,S.events.length));
    for(let i=0;i<S.shown;i++){const e=S.events[i];if(e.onShow&&!e.applied){e.onShow();e.applied=true}if(e.hl)S.hl[e.hl.tab]=e.hl.key}
    const last=S.events[S.shown-1];
    if(last&&last.hl&&S.shown>prevShown)S.tab=last.hl.tab;
    S.sel=last?last.id:null;S.fresh=sameCase&&S.shown===prevShown+1&&last?last.id:null;
    S.playing=!!st.playing&&st.driver===ME;
    render();S.fresh=null;
    if(S.playing&&!awaiting()&&S.shown<S.events.length)schedule(400/S.speed);
  }finally{SYNC.applying=false;syncBadge()}
}
async function syncStream(){
  if(!HUB||SYNC.expired)return;
  try{
    const r=await fetch(HUB.url+'/api/agent-hub/stream',{headers:{Authorization:'Bearer '+HUB.token}});
    if(r.status===401){SYNC.expired=true;SYNC.connected=false;syncBadge();return}
    if(!r.ok||!r.body)throw new Error('HTTP '+r.status);
    SYNC.connected=true;syncBadge();
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        if(/^event: cases$/m.test(chunk)){loadCases();continue}
        if(!/^event: state$/m.test(chunk))continue;
        const data=chunk.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('\n');
        try{const snap=JSON.parse(data);
          // 共用狀態還是空的（第一次使用）：把本機目前的案件送上去當起點
          if(snap.state==null){if(snap.rev===0&&SYNC.rev===0)syncPush()}else syncApply(snap)}catch(e){}
      }
    }
  }catch(e){}
  SYNC.connected=false;syncBadge();setTimeout(syncStream,2000);
}
// 推進播放的畫面關掉或斷線：6 秒沒有新進度就由這個畫面接手
setInterval(()=>{const st=SYNC.remote;
  if(!HUB||!SYNC.connected||!st||!st.playing||st.driver===ME||S.playing)return;
  if(Date.now()-SYNC.lastAt>6000&&!awaiting()&&S.shown<S.events.length){S.playing=true;schedule(150);syncPush()}},2000);

/* ===== 待處理案件（起點在選布平台）=====
   選布平台的案件清單（GET /api/agent-hub/cases）：每 5 秒更新，即時推送說有變動時也立刻更新。
   點一件案件就用客戶的真實輸入跑對應的劇本並自動播放；推進到等待業務確認時標為「待業務確認」，
   業務核准（或修改後核准）後由選布平台寫回：樣品申請改為已核准／替客戶建立已核准的打色樣申請。 */
const CASE_STATUS={new:{t:'新案件',c:'--st-sub'},working:{t:'處理中',c:'--st-work'},waiting:{t:'待業務確認',c:'--st-wait'},done:{t:'已完成',c:'--st-ok'}};
const CASE_KIND={sample_request:'樣品申請',custom_colour:'自訂顏色',photo_search:'照片找布',text_search:'文字找布',inquiry:'詢價',new_fabric:'建檔新布',sample_feedback:'寄樣回饋',trade_lead:'展後跟進',showroom_interest:'買家展示間'};
let CASES=[],CASES_ERR='';
function fmtWhen(s){if(!s)return '';const d=caseTime({created_at:s}),m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1)return '剛剛';if(m<60)return `${m} 分鐘前`;if(m<24*60)return `${Math.round(m/60)} 小時前`;return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function caseSummary(c){const i=c.input||{};
  if(c.kind==='sample_request'){const it=i.items||[];return `${it.length} 款：${it.slice(0,3).map(x=>x.article_no).join('、')}${it.length>3?'…':''}${i.color_reference?'・附指定顏色':''}`}
  if(c.kind==='custom_colour'){const col=i.colour||{};return `${i.article_no||''} ${i.name||''}・「${col.name||''}」`}
  if(c.kind==='photo_search')return `${i.no_results?'找不到符合的布':`找到 ${i.results} 筆`}${i.text?`・補充「${i.text}」`:''}`;
  if(c.kind==='text_search')return `「${i.query||''}」・${i.no_results?'找不到符合的布':`找到 ${i.results} 筆`}${(i.queries||[]).length>1?`・共搜尋 ${i.queries.length} 次`:''}`;
  if(c.kind==='inquiry')return `「${i.subject||'（無主旨）'}」・${(i.items||[]).length} 個品項${(i.missing||[]).length?'・缺資料':''}`;
  if(c.kind==='new_fabric')return `${i.article_no||''} ${i.name||''}${i.duplicate?'・疑似重複':''}`;
  if(c.kind==='sample_feedback'){const it=i.items||[];return `申請 #${i.request_id}・${it.length} 款回饋${it.some(x=>(x.feedback||[]).some(f=>f.verdict!=='match'))?'・有需調整':''}`}
  if(c.kind==='trade_lead')return `${(i.show&&i.show.name)||'展會'}・${(i.fabrics||[]).length?`掃過 ${(i.fabrics||[]).length} 款`:'手動名單'}`;
  if(c.kind==='showroom_interest')return `點看 ${(i.viewed||[]).slice(0,3).join('、')}${(i.viewed||[]).length>3?'…':''}`;
  return ''}
function renderInbox(){
  const box=$('inbox');if(!box)return;
  if(!HUB){$('inbox-note').textContent='以選布平台帳號登入後，客戶在選布平台送出的樣品申請與 ColorMind 選色會出現在這裡。';box.innerHTML='';return}
  const open=CASES.filter(c=>c.status!=='done'),done=CASES.filter(c=>c.status==='done').slice(0,5);
  $('inbox-note').textContent=CASES_ERR||(open.length?`${open.length} 件待處理・點一件開始處理`:'目前沒有待處理的案件。客戶在選布平台送出樣品申請、或用 ColorMind 選色後，會出現在這裡。');
  const cur=isCase()?S.case.id:null;
  box.innerHTML=[...open,...done].map(c=>{const st=CASE_STATUS[c.status]||CASE_STATUS.new;
    return `<button type="button" class="case" data-id="${c.id}" aria-current="${c.id===cur}"><span class="pill" style="--sc:var(${st.c})">${st.t}</span><span class="mono sub">C-${c.id}</span><span class="grow"><strong>${CASE_KIND[c.kind]||esc(c.kind)}</strong>・${esc(custName(c))}<span class="sub">　${esc(caseSummary(c))}</span></span><span class="sub">${esc(fmtWhen(c.created_at))}</span></button>`}).join('');
  box.querySelectorAll('.case').forEach(b=>b.onclick=()=>{const c=CASES.find(x=>x.id===+b.dataset.id);if(c)openCase(c)});
}
async function loadCases(){
  if(!HUB||SYNC.expired)return;
  try{
    const r=await fetch(HUB.url+'/api/agent-hub/cases',{headers:{Authorization:'Bearer '+HUB.token}});
    if(r.status===401){SYNC.expired=true;syncBadge();return}
    const b=await r.json();
    if(Array.isArray(b.cases)){const cmBefore=JSON.stringify(caseColorMind());CASES=b.cases;CASES_ERR='';
      if(isCase()){const c=CASES.find(x=>x.id===S.case.id);if(c)S.case.status=c.status}
      renderInbox();if(isCase())renderParams();
      if(isDone()&&JSON.stringify(caseColorMind())!==cmBefore)renderThread()}
  }catch(e){CASES_ERR='暫時讀不到選布平台的案件，稍後會自動重試';renderInbox()}
}
/* 案件狀態：start（有人打開）→ wait（等業務確認）→ decide（業務核准，選布平台寫回）；寫回只送一次，第二次會被擋下 */
async function caseAction(action,extra){
  if(!HUB||!isCase())return;
  const id=S.case.id;
  try{
    const r=await fetch(`${HUB.url}/api/agent-hub/cases/${id}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+HUB.token},body:JSON.stringify({action,...(extra||{})})});
    const b=await r.json().catch(()=>null);
    if(action==='decide'&&!r.ok)CASES_ERR=b&&b.error==='already_done'?`案件 C-${id} 已經有人決定過，選布平台保留第一次的決定`:`案件 C-${id} 寫回選布平台失敗（${r.status}），請稍後重試`;
    if(b&&b.case){const k=CASES.findIndex(x=>x.id===id);if(k>=0)CASES[k]=b.case;if(isCase()&&S.case.id===id)S.case.status=b.case.status}
  }catch(e){if(action==='decide')CASES_ERR=`案件 C-${id} 寫回選布平台失敗（連線中斷），請稍後重試`}
  renderInbox();if(isCase())renderParams();
  if(action==='decide'&&isDone()&&caseColorMind()!==undefined)renderThread(); // 自訂顏色：ColorMind 的結果
}
function openCase(c){
  const k=caseScen(c.kind);if(k<0)return;
  stopPlay();S.scen=k;S.case={id:c.id,kind:c.kind,input:c.input,created_at:c.created_at,status:c.status};
  $('scenario').value='';
  start(true);renderParams();renderInbox();
  if(c.status==='done'){
    // 已完成：直接顯示整件案件與當時的決定，不再送出
    const d=c.outcome&&c.outcome.decision,e=[...S.events].reverse().find(x=>x.status==='INPUT_REQUIRED'&&!x.decided);
    if(d&&e){e.decided=d;S.decisions.push({kind:d,reason:''});S.events.push(...decisionEvents(d,e,''))}
    S.shown=S.events.length;S.sel=S.events[S.shown-1].id;
    for(const x of S.events){if(x.onShow&&!x.applied){x.onShow();x.applied=true}if(x.hl)S.hl[x.hl.tab]=x.hl.key}
    render();syncPush(true);return}
  if(c.status==='new')caseAction('start');
  S.playing=true;schedule(300);syncPush(true);
}
/* 即時推送連不上時（例如經過不支援串流的代理）：每 5 秒讀一次共用狀態與案件清單 */
setInterval(()=>{
  loadCases();
  if(!HUB||SYNC.connected||SYNC.expired)return;
  (async()=>{try{
    const r=await fetch(HUB.url+'/api/agent-hub/state',{headers:{Authorization:'Bearer '+HUB.token}});
    if(r.status===401){SYNC.expired=true;syncBadge();return}
    const b=await r.json();SYNC.polling=true;
    if(b.state==null){if(b.rev===0&&SYNC.rev===0)syncPush()}else syncApply(b);
    syncBadge();
  }catch(e){}})();
},5000);

renderParams();start(true);
syncBadge();syncStream();
renderInbox();loadCases();
</script>
</body>
